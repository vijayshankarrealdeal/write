name: inkspacex
description: "InkSpaceX - Write, create, share your stories with the world."
# The following line prev ents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.2+8

environment:
  sdk: ^3.10.8

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.

  # Self-hosted backend (FastAPI + PostgreSQL + MinIO).
  # Google OAuth runs entirely on the backend — the app only opens the
  # backend URL in a browser (`url_launcher` on native, full-page redirect
  # on web) and either receives tokens via URL fragment (web) or polls the
  # backend's session endpoint for them (native).

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  auto_size_text: ^3.0.0
  flutter_quill: ^11.5.0
  image_picker: ^1.1.2
  shared_preferences: ^2.5.4
  cached_network_image: ^3.4.1
  flutter_blurhash: ^0.9.1
  iconify_flutter: ^0.0.7
  google_fonts: ^8.0.2
  http: ^1.2.0
  http_parser: ^4.0.2
  url_launcher: ^6.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.3
  intl: ^0.20.2
  flutter_svg: ^2.2.3
  web: ^1.1.1
  go_router: ^17.2.3
  logger: ^2.7.0
  connectivity_plus: ^7.1.1
  # OS-level notifications when an SSE notification arrives in the
  # foreground. Background/killed-app push needs FCM/APNS native config
  # in addition to this package — see LocalNotificationService.
  flutter_local_notifications: ^21.0.0
  # Audiobook playback. `just_audio` is the player; `just_audio_background`
  # wraps it with `audio_service` under the hood so Now Playing / lock-screen
  # controls work on iOS and the Android media-style notification appears
  # automatically — tapping it opens the app at the current chapter. The
  # Apple-Music-style highlighted-text view in `AudioPlayerPage` listens to
  # the position stream and binary-searches the words.json for the active
  # word. See `lib/services/audio_playback_service.dart`.
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.16
  audio_session: ^0.2.2
  rxdart: ^0.28.0
  # NB: path_provider is already declared further down for the offline store.
  # `flutter_local_notifications.zonedSchedule` requires a TZDateTime,
  # so we pull `timezone` in as a direct dep (otherwise it's transitive
  # via flutter_local_notifications). `flutter_timezone` reads the
  # device's IANA zone so a 9 PM reminder stays at 9 PM after the
  # user crosses a timezone — without it, `tz.local` defaults to UTC.
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  # Phase 4 (offline `.inkx`): pure-Dart crypto for AES-GCM, HKDF, HMAC,
  # and Ed25519 signature verify. The package falls back to pure Dart in
  # unit tests; production builds may later layer `cryptography_flutter`
  # on top for native acceleration.
  cryptography: ^2.7.0
  # Phase 4: resolve <appSupport> for the on-disk offline store.
  path_provider: ^2.1.5
  # Email/password creds for silent re-login when both access and refresh
  # tokens are gone (e.g. token TTL exceeded after a long offline stretch).
  # Backed by Keychain (iOS/macOS) and EncryptedSharedPreferences (Android);
  # Web falls back to an AES-encrypted localStorage entry.
  flutter_secure_storage: ^10.2.0

  # Device + app metadata for analytics. `device_info_plus` resolves the
  # specific model (Pixel 8, iPhone15,3, MacBookPro18,3, etc.) so the
  # admin "Top devices" panel is meaningful instead of a wall of
  # truncated user-agent strings. `package_info_plus` provides the
  # build version stamped onto every event so we can correlate
  # behaviour with rollouts. Region is derived from `Platform.localeName`
  # (no plugin) — locale country code, NOT GPS/IP geolocation. See
  # privacy_policy.html §3.2 and lib/services/analytics_service.dart.
  # Pinned to 12.x because 13.x bumps `win32` to ^6.0.1, which conflicts
  # with the win32 ^5.0.0 transitive dep from flutter_secure_storage 9.x.
  # 12.4.x covers the same APIs we use (Android model, iOS utsname,
  # WebBrowserInfo) so the downgrade is purely cosmetic.
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1

  # Home-screen widgets on iOS / macOS (WidgetKit) and Android (AppWidget).
  # The Flutter side just writes data into a shared container; native code
  # reads it and renders the widget.
  home_widget: ^0.9.1
  # Windows has no real "home-screen widget" surface, so we expose the
  # same quick actions through a system-tray icon instead. Cross-platform
  # tray support; on Windows it lights up the taskbar tray.
  tray_manager: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# ─── Launcher Icons ───
flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#007AFF"
    theme_color: "#007AFF"
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#007AFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/doodles/
    - assets/scribbles/

  fonts:
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather/Merriweather-Regular.ttf
        - asset: assets/fonts/Merriweather/Merriweather-Italic.ttf
          style: italic
        - asset: assets/fonts/Merriweather/Merriweather-Bold.ttf
          weight: 700
        - asset: assets/fonts/Merriweather/Merriweather-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora/Lora-Variable.ttf
        - asset: assets/fonts/Lora/Lora-Italic-Variable.ttf
          style: italic
    - family: PT Serif
      fonts:
        - asset: assets/fonts/PTSerif/PTSerif-Regular.ttf
        - asset: assets/fonts/PTSerif/PTSerif-Italic.ttf
          style: italic
        - asset: assets/fonts/PTSerif/PTSerif-Bold.ttf
          weight: 700
        - asset: assets/fonts/PTSerif/PTSerif-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4/SourceSerif4-Variable.ttf
        - asset: assets/fonts/SourceSerif4/SourceSerif4-Italic-Variable.ttf
          style: italic
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay/PlayfairDisplay-Variable.ttf
        - asset: assets/fonts/PlayfairDisplay/PlayfairDisplay-Italic-Variable.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Variable.ttf
        - asset: assets/fonts/Inter/Inter-Italic-Variable.ttf
          style: italic
    - family: Open Sans
      fonts:
        - asset: assets/fonts/OpenSans/OpenSans-Variable.ttf
        - asset: assets/fonts/OpenSans/OpenSans-Italic-Variable.ttf
          style: italic
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible/AtkinsonHyperlegible-Italic.ttf
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegible/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible/AtkinsonHyperlegible-BoldItalic.ttf
          weight: 700
          style: italic

