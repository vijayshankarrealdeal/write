<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Abstract share/publish illustration - connected nodes radiating outward -->
  <defs>
    <linearGradient id="glow3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.02"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Radiating circles -->
  <circle cx="200" cy="195" r="160" stroke="white" stroke-opacity="0.04" stroke-width="1" fill="none"/>
  <circle cx="200" cy="195" r="120" stroke="white" stroke-opacity="0.06" stroke-width="1" fill="none"/>
  <circle cx="200" cy="195" r="80" stroke="white" stroke-opacity="0.08" stroke-width="1" fill="none"/>
  <circle cx="200" cy="195" r="40" fill="url(#pulse)"/>

  <!-- Center document node -->
  <rect x="180" y="175" width="40" height="40" rx="8"
        fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.4" stroke-width="1.5"/>
  <line x1="190" y1="190" x2="210" y2="190" stroke="white" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="190" y1="200" x2="205" y2="200" stroke="white" stroke-opacity="0.3" stroke-width="1" stroke-linecap="round"/>

  <!-- Connection lines to outer nodes -->
  <!-- Top -->
  <line x1="200" y1="175" x2="200" y2="100" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="200" cy="90" r="14" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="200" cy="90" r="5" fill="white" fill-opacity="0.25"/>

  <!-- Top-right -->
  <line x1="220" y1="180" x2="290" y2="120" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="296" cy="114" r="12" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="296" cy="114" r="4" fill="white" fill-opacity="0.2"/>

  <!-- Right -->
  <line x1="220" y1="195" x2="310" y2="195" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="320" cy="195" r="16" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="320" cy="195" r="5.5" fill="white" fill-opacity="0.3"/>

  <!-- Bottom-right -->
  <line x1="220" y1="210" x2="280" y2="270" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="286" cy="278" r="13" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="286" cy="278" r="4.5" fill="white" fill-opacity="0.22"/>

  <!-- Bottom -->
  <line x1="200" y1="215" x2="200" y2="300" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="200" cy="310" r="14" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="200" cy="310" r="5" fill="white" fill-opacity="0.25"/>

  <!-- Bottom-left -->
  <line x1="180" y1="210" x2="120" y2="270" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="114" cy="278" r="11" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <circle cx="114" cy="278" r="4" fill="white" fill-opacity="0.18"/>

  <!-- Left -->
  <line x1="180" y1="195" x2="100" y2="195" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="88" cy="195" r="15" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="88" cy="195" r="5" fill="white" fill-opacity="0.25"/>

  <!-- Top-left -->
  <line x1="180" y1="180" x2="115" y2="125" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="108" cy="118" r="12" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.16" stroke-width="1"/>
  <circle cx="108" cy="118" r="4" fill="white" fill-opacity="0.2"/>

  <!-- Extra sparkle dots -->
  <circle cx="340" cy="150" r="1.5" fill="white" fill-opacity="0.3"/>
  <circle cx="60" cy="250" r="2" fill="white" fill-opacity="0.2"/>
  <circle cx="250" cy="340" r="1.5" fill="white" fill-opacity="0.25"/>
</svg>
