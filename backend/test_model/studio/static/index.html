<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkspace Studio</title>
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #ededed;
    --fg-dim: #9a9a9a;
    --card: #161616;
    --card-hover: #1f1f1f;
    --border: #262626;
    --accent: #d4a056;
    --danger: #d96c5a;
    --ok: #6ec087;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  button {
    font: inherit; cursor: pointer; background: var(--card); color: var(--fg);
    border: 1px solid var(--border); padding: .55em 1em; border-radius: 6px;
    transition: background .15s ease, border-color .15s ease;
  }
  button:hover { background: var(--card-hover); border-color: var(--accent); }
  button[disabled] { opacity: .5; cursor: not-allowed; }

  header {
    padding: 22px 32px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 18px;
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .02em; }
  header nav { font-size: 14px; color: var(--fg-dim); }
  header nav a { margin-right: 14px; }
  header nav a.crumb { color: var(--accent); }

  main { padding: 28px 32px 80px; max-width: 1400px; margin: 0 auto; }

  /* ── Library view ── */
  .row-title { font-size: 22px; font-weight: 600; margin: 4px 0 18px; }
  .book-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 22px;
  }
  .book-card {
    cursor: pointer; transition: transform .15s ease;
    display: flex; flex-direction: column;
  }
  .book-card:hover { transform: translateY(-3px); }
  .cover {
    aspect-ratio: 2/3; background: var(--card); border-radius: 8px;
    overflow: hidden; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-placeholder {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    color: var(--fg-dim); padding: 18px; text-align: center;
  }
  .cover-placeholder .title { color: var(--fg); font-size: 14px; font-weight: 600; }
  .cover-placeholder button { font-size: 13px; }
  .book-card .meta {
    margin-top: 12px;
  }
  .book-card .meta .title {
    font-size: 16px; font-weight: 600; line-height: 1.3;
  }
  .book-card .meta .author { color: var(--fg-dim); font-size: 13px; margin-top: 2px; }
  .book-card .meta .genres {
    color: var(--fg-dim); font-size: 11px; text-transform: uppercase;
    letter-spacing: .08em; margin-top: 6px;
  }

  /* ── Book detail ── */
  .book-detail { display: grid; grid-template-columns: 280px 1fr; gap: 36px; }
  @media (max-width: 720px) { .book-detail { grid-template-columns: 1fr; } }
  .book-detail .cover-large {
    aspect-ratio: 2/3; background: var(--card); border-radius: 10px;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .book-detail .cover-large img { width: 100%; height: 100%; object-fit: cover; }
  .book-detail .info h2 { margin: 0; font-size: 28px; font-weight: 600; }
  .book-detail .info .author { color: var(--fg-dim); margin-top: 6px; font-size: 15px; }
  .book-detail .info .description {
    margin-top: 18px; color: #c8c8c8; max-width: 60ch;
  }
  .book-detail .info .genres { margin-top: 14px; font-size: 12px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: .08em; }

  .section-title { font-size: 18px; font-weight: 600; margin: 36px 0 14px; }

  .cast-strip {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 16px;
  }
  .cast-card {
    background: var(--card); border-radius: 8px; padding: 12px; text-align: center;
  }
  .cast-portrait {
    aspect-ratio: 1; background: var(--bg); border-radius: 6px; margin-bottom: 10px;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .cast-portrait img { width: 100%; height: 100%; object-fit: cover; }
  .cast-name { font-size: 13px; font-weight: 600; }
  .cast-bio { font-size: 11px; color: var(--fg-dim); margin-top: 4px; line-height: 1.4; }

  .chapter-list { display: flex; flex-direction: column; gap: 8px; }
  .chapter-item {
    background: var(--card); border-radius: 6px; padding: 14px 18px;
    border: 1px solid var(--border); cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .chapter-item:hover { background: var(--card-hover); border-color: var(--accent); }
  .chapter-item .ch-num { color: var(--fg-dim); font-size: 12px; }
  .chapter-item .ch-title { font-weight: 600; margin-top: 2px; }

  /* ── Reader ── */
  .reader { max-width: 720px; margin: 0 auto; }
  .reader p { margin: 0 0 1em; }
  .reader h1, .reader h2, .reader h3 {
    line-height: 1.25; margin: 1.6em 0 .5em;
  }
  .reader h1 { font-size: 28px; }
  .reader h2 { font-size: 22px; }
  .reader h3 { font-size: 18px; }
  .reader blockquote {
    margin: 1em 0; padding: 0 1em; border-left: 3px solid var(--border);
    color: #cfcfcf; font-style: italic;
  }
  .reader em { font-style: italic; }
  .reader strong { font-weight: 600; }
  .reader figure {
    margin: 2em 0; text-align: center;
  }
  .reader figure img {
    max-width: 100%; border-radius: 8px;
  }
  .reader figure figcaption {
    margin-top: 8px; font-size: 13px; color: var(--fg-dim); font-style: italic;
  }
  .reader .scene-card {
    margin: 2em 0; padding: 18px; border: 1px dashed var(--border);
    border-radius: 8px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .reader .scene-card .scene-hint {
    font-size: 13px; color: var(--fg-dim); max-width: 50ch; font-style: italic;
  }
  .reader .scene-card.failed { border-color: var(--danger); }
  .reader .scene-card .err { color: var(--danger); font-size: 12px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); padding: 10px 18px;
    border-radius: 8px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.4);
    z-index: 99;
  }
  .toast.ok { border-color: var(--ok); }
  .toast.err { border-color: var(--danger); }
  .spinner {
    width: 14px; height: 14px; border: 2px solid var(--fg-dim);
    border-top-color: var(--accent); border-radius: 50%; display: inline-block;
    animation: spin 0.7s linear infinite; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty {
    text-align: center; padding: 80px 20px; color: var(--fg-dim);
  }
  .empty h2 { color: var(--fg); margin: 0 0 14px; }
  .empty code {
    background: var(--card); padding: 2px 8px; border-radius: 4px;
    color: var(--accent); font-size: 13px;
  }

  /* ── Generation queue dock ── */
  #dock {
    position: fixed; bottom: 20px; right: 20px;
    width: 340px; max-height: 60vh; overflow-y: auto;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 8px 32px rgba(0,0,0,.5);
    z-index: 80; display: none;
  }
  #dock.open { display: block; }
  #dock-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    font-size: 13px; font-weight: 600;
  }
  #dock-header .clear {
    color: var(--fg-dim); font-size: 12px; cursor: pointer;
    background: transparent; border: none; padding: 0;
  }
  #dock-header .clear:hover { color: var(--fg); }
  .dock-job {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    font-size: 12px; display: flex; flex-direction: column; gap: 4px;
  }
  .dock-job:last-child { border-bottom: none; }
  .dock-job .row { display: flex; align-items: center; gap: 8px; }
  .dock-job .label { flex: 1; color: var(--fg); font-weight: 500; }
  .dock-job .meta { color: var(--fg-dim); font-size: 11px; }
  .dock-job.success .label { color: var(--ok); }
  .dock-job.failed .label { color: var(--danger); }
  .dock-job .attempts {
    color: var(--fg-dim); font-size: 11px; font-style: italic;
  }
  .dock-toggle {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 24px; padding: 8px 14px;
    font-size: 13px; cursor: pointer; z-index: 79;
    display: none; align-items: center; gap: 8px;
  }
  .dock-toggle.visible { display: inline-flex; }
  .dock-toggle .badge {
    background: var(--accent); color: var(--bg);
    border-radius: 10px; padding: 1px 7px;
    font-weight: 600; font-size: 11px;
  }

  /* ── Gen-all panel + live progress (book detail) ──────────────── */
  .gen-panel {
    display: flex; flex-direction: column; gap: 10px;
    max-width: 640px;
  }
  .gen-panel-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
  }
  .gen-all-btn {
    background: var(--accent); color: var(--bg);
    border: none; padding: .8em 1.4em;
    border-radius: 24px; font-weight: 600; font-size: 15px;
    cursor: pointer; align-self: flex-start;
    display: inline-flex; align-items: center; gap: 10px;
    transition: opacity .15s ease;
  }
  .gen-all-btn:disabled { cursor: default; opacity: .85; }
  .gen-all-btn .spinner { border-top-color: var(--bg); }
  .ghost-btn {
    background: transparent; color: var(--fg);
    border: 1px solid var(--border);
    padding: .7em 1.2em; border-radius: 24px;
    font-weight: 500; cursor: pointer;
  }
  .progress-bar {
    height: 6px; width: 100%; max-width: 480px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 4px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--accent);
    transition: width .3s ease;
  }
  .progress-meta { color: var(--fg-dim); font-size: 13px; }
  .running-chips {
    display: flex; flex-wrap: wrap; gap: 6px; max-width: 720px;
  }
  .run-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--card); border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 14px;
    font-size: 12px; color: var(--fg-dim);
  }
  .run-chip.subtle { color: var(--fg-dim); border-style: dashed; }
  .run-chip .spinner { width: 11px; height: 11px; border-width: 2px; }

  /* ── Idle/pending placeholders on cast & scene cards ─────────── */
  .card-pending {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
    color: var(--fg-dim); font-size: 12px; padding: 8px;
    text-align: center;
  }
  .cast-card.is-running .card-pending,
  .reader .scene-card.is-running { border-color: var(--accent); }
  .reader .scene-card .scene-status {
    margin-top: 8px;
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--fg-dim); font-size: 13px;
  }
  .subtle { color: var(--fg-dim); }
</style>
</head>
<body>
<header>
  <h1>Inkspace Studio</h1>
  <nav id="crumbs"><a href="#/">Library</a></nav>
</header>
<main id="app"></main>
<div id="toast-host"></div>

<!-- Generation queue dock — survives navigation so you can fire jobs
     across books and watch them all progress in parallel. -->
<button id="dock-toggle" class="dock-toggle" type="button">
  <span class="spinner"></span>
  <span class="badge" id="dock-toggle-count">0</span>
  <span>jobs</span>
</button>
<div id="dock">
  <div id="dock-header">
    <span id="dock-title">Generating</span>
    <button class="clear" id="dock-clear" type="button">clear finished</button>
  </div>
  <div id="dock-jobs"></div>
</div>

<script>
"use strict";

// ─── State + routing ────────────────────────────────────────────────
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

function escapeHtml(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail ?? detail; } catch {}
    throw new Error(`${res.status} ${detail}`);
  }
  return res.json();
}

function toast(msg, kind = "") {
  const host = $("#toast-host");
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// ─── Generation job queue ──────────────────────────────────────────
//
// A single global queue. Each call to `JobQueue.enqueue(...)` returns
// immediately — the fetch happens in the background, with at most
// MAX_CONCURRENT requests in flight at once (Azure rate-limit friendly).
// The dock listens for `dock-update` events and re-renders.
//
// State survives navigation between routes because everything lives
// on `window.__queue`. The dock is also outside `<main>` so the DOM
// node persists across route renders.

const MAX_CONCURRENT = 5;

if (!window.__queue) {
  window.__queue = {
    seq: 0,
    inflight: new Map(),     // id → job
    finished: [],            // history (auto-trim to last 30)
    pending: [],             // queued, awaiting a free slot
    listeners: new Set(),    // route handlers subscribe to update buttons
  };
}
const Q = window.__queue;

function emitDockUpdate() {
  // The dock listener (renderDock) is cheap — DOM-only updates — so we
  // fire it on every event.
  document.dispatchEvent(new CustomEvent("dock-update"));
  // Route listeners (renderBook / renderChapter) re-fetch the API and
  // rewrite #app; they are HEAVY. If we fire them on every queue event
  // we get ~30 concurrent renderBook calls when the user clicks
  // "Generate all 23 images" and the page freezes. Debounce them to at
  // most one dispatch per 500ms.
  if (Q._listenerTimer) return;
  Q._listenerTimer = setTimeout(() => {
    Q._listenerTimer = null;
    Q.listeners.forEach(fn => { try { fn(); } catch {} });
  }, 500);
}

function jobKey(slug, kind, id) { return `${slug}::${kind}::${id ?? ""}`; }

const JobQueue = {
  // Each job: {id, key, slug, kind, targetId, label, status, startedAt, attempts, url, error}
  enqueue({ slug, kind, targetId = null, label }) {
    const key = jobKey(slug, kind, targetId);
    // Dedup: if we already have an in-flight or pending job for this exact
    // target, don't fire a second one.
    for (const j of Q.inflight.values()) {
      if (j.key === key) return j;
    }
    for (const j of Q.pending) {
      if (j.key === key) return j;
    }
    const job = {
      id: ++Q.seq, key, slug, kind, targetId, label,
      status: "pending", startedAt: Date.now(),
      attempts: 0, url: null, error: null,
    };
    Q.pending.push(job);
    emitDockUpdate();
    this._drain();
    return job;
  },

  _drain() {
    while (Q.inflight.size < MAX_CONCURRENT && Q.pending.length > 0) {
      const job = Q.pending.shift();
      job.status = "running";
      job.startedAt = Date.now();
      Q.inflight.set(job.id, job);
      emitDockUpdate();
      this._run(job).catch(() => {});
    }
  },

  async _run(job) {
    let url;
    let payload = "{}";
    if (job.kind === "scene") {
      url = `/api/books/${encodeURIComponent(job.slug)}/images/${encodeURIComponent(job.targetId)}/generate`;
    } else if (job.kind === "character") {
      url = `/api/books/${encodeURIComponent(job.slug)}/characters/${encodeURIComponent(job.targetId)}/generate`;
    } else if (job.kind === "cover") {
      url = `/api/books/${encodeURIComponent(job.slug)}/cover/generate`;
    } else if (job.kind === "deploy") {
      url = `/api/books/${encodeURIComponent(job.slug)}/deploy`;
      payload = JSON.stringify({ run_sync: true, force: job.force === true });
    } else {
      job.status = "failed";
      job.error = `unknown kind: ${job.kind}`;
    }
    try {
      const resp = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payload,
      });
      const text = await resp.text();
      let body;
      try { body = JSON.parse(text); } catch { body = { detail: text }; }
      if (!resp.ok) throw new Error(body.detail ?? resp.statusText);
      job.status = "success";
      job.url = body.url;
      job.attempts = body.attempts_taken ?? 1;
      job.result = body;
      if (job.kind === "deploy" && body.sync) {
        // Surface the sync_to_db.py output for visibility.
        job.syncRc = body.sync.rc;
        if (body.sync.rc !== 0) {
          job.status = "failed";
          job.error = `sync_to_db.py exited ${body.sync.rc}: ${(body.sync.stderr || body.sync.stdout || "").slice(-300)}`;
        }
      }
    } catch (exc) {
      job.status = "failed";
      job.error = String(exc.message ?? exc);
    }
    Q.inflight.delete(job.id);
    Q.finished.unshift(job);
    if (Q.finished.length > 30) Q.finished.length = 30;
    // Browser notification on completion. Per-job for failures; a single
    // "batch complete" when the last in-flight + pending job for a slug
    // drains. Quiet success per-job to avoid notification spam.
    notifyJob(job);
    maybeNotifyBatchComplete(job.slug);
    emitDockUpdate();
    this._drain();
  },

  clearFinished() {
    Q.finished = [];
    emitDockUpdate();
  },

  // Convenience: enqueue every "pending"-status scene in a chapter at once.
  enqueueChapter(slug, sceneEntries) {
    for (const s of sceneEntries) {
      this.enqueue({
        slug, kind: "scene", targetId: s.sceneId,
        label: `${slug} / ${s.sceneId.slice(0, 10)}`,
      });
    }
  },
};

// ─── Dock rendering ────────────────────────────────────────────────

function renderDock() {
  const dock = $("#dock");
  const jobs = $("#dock-jobs");
  const toggle = $("#dock-toggle");
  const count = $("#dock-toggle-count");
  const title = $("#dock-title");

  const inflight = Array.from(Q.inflight.values()).sort((a, b) => a.startedAt - b.startedAt);
  const pending = Q.pending.slice();
  const finished = Q.finished.slice(0, 10);

  const liveCount = inflight.length + pending.length;
  count.textContent = String(liveCount);
  toggle.classList.toggle("visible", liveCount > 0 && !dock.classList.contains("open"));
  title.textContent = liveCount > 0
    ? `Generating · ${inflight.length} in flight, ${pending.length} queued`
    : `Recent jobs`;

  // Auto-open the dock the first time a job starts.
  if (liveCount > 0 && !window.__dockEverOpened) {
    dock.classList.add("open");
    window.__dockEverOpened = true;
  }

  const rows = [];
  for (const j of inflight) {
    const elapsed = ((Date.now() - j.startedAt) / 1000).toFixed(0);
    rows.push(`
      <div class="dock-job">
        <div class="row">
          <span class="spinner"></span>
          <span class="label">${escapeHtml(j.label)}</span>
          <span class="meta">${elapsed}s</span>
        </div>
        <div class="meta">${escapeHtml(j.kind)}${j.attempts ? ` · attempt ${j.attempts}` : ""}</div>
      </div>`);
  }
  for (const j of pending) {
    rows.push(`
      <div class="dock-job">
        <div class="row">
          <span class="meta">⋯</span>
          <span class="label">${escapeHtml(j.label)}</span>
          <span class="meta">queued</span>
        </div>
      </div>`);
  }
  for (const j of finished) {
    const tone = j.status === "success" ? "success" : "failed";
    const note = j.status === "success"
      ? `done${j.attempts > 1 ? ` after ${j.attempts} attempts` : ""}`
      : escapeHtml((j.error || "").slice(0, 80));
    rows.push(`
      <div class="dock-job ${tone}">
        <div class="row">
          <span>${j.status === "success" ? "✓" : "✗"}</span>
          <span class="label">${escapeHtml(j.label)}</span>
        </div>
        <div class="meta">${note}</div>
      </div>`);
  }
  jobs.innerHTML = rows.join("") || `<div class="dock-job"><span class="meta">No recent jobs.</span></div>`;
}

document.addEventListener("dock-update", renderDock);
// Tick once a second to refresh elapsed-time counters on in-flight jobs.
setInterval(() => { if (Q.inflight.size > 0) renderDock(); }, 1000);

// Wire dock open/close + clear once the DOM is ready.
document.addEventListener("DOMContentLoaded", () => {
  const dock = $("#dock");
  $("#dock-toggle").addEventListener("click", () => {
    dock.classList.add("open");
    $("#dock-toggle").classList.remove("visible");
  });
  $("#dock-clear").addEventListener("click", () => JobQueue.clearFinished());
  renderDock();
});

function setCrumbs(...crumbs) {
  $("#crumbs").innerHTML =
    `<a href="#/" class="${crumbs.length ? "" : "crumb"}">Library</a>` +
    crumbs.map((c, i) =>
      ` › <a href="${escapeHtml(c.href)}" class="${i === crumbs.length - 1 ? "crumb" : ""}">${escapeHtml(c.label)}</a>`
    ).join("");
}

// Route-level subscription: every render re-registers a listener that
// refreshes the visible page when ANY job lands. Previous listeners
// (for old route instances) are detached on each call.
let _routeListener = null;
function setRouteListener(fn) {
  if (_routeListener) Q.listeners.delete(_routeListener);
  _routeListener = fn;
  if (fn) Q.listeners.add(fn);
}

// ─── Library view ───────────────────────────────────────────────────
async function renderLibrary() {
  setCrumbs();
  // When a cover finishes anywhere, re-pull /api/books so the library
  // card flips from placeholder to image without manual refresh.
  setRouteListener(() => renderLibrary());
  const app = $("#app");
  app.innerHTML = `<div class="row-title">Library</div><div id="library"></div>`;
  let books;
  try {
    books = await api("/api/books");
  } catch (e) {
    $("#library").innerHTML = `<div class="empty"><h2>Could not load library</h2><p>${escapeHtml(e.message)}</p></div>`;
    return;
  }
  if (!books.length) {
    $("#library").innerHTML = `
      <div class="empty">
        <h2>No books yet</h2>
        <p>Drop a book into <code>data/</code> and ask Claude to prep it.</p>
        <p>Once a book's <code>manifest.ready_for_runtime</code> is <code>true</code>, it'll show up here.</p>
      </div>`;
    return;
  }
  $("#library").innerHTML = `<div class="book-grid">${
    books.map(b => bookCardHtml(b)).join("")
  }</div>`;
  $$(".book-card").forEach(el => {
    el.addEventListener("click", () => {
      location.hash = `#/book/${encodeURIComponent(el.dataset.slug)}`;
    });
  });
  $$(".book-card .cover-placeholder button").forEach(btn => {
    btn.addEventListener("click", async (ev) => {
      ev.stopPropagation();
      const slug = btn.dataset.slug;
      await generateCover(slug, btn);
    });
  });
}

function bookCardHtml(book) {
  const coverInner = book.cover_status === "ready"
    ? `<img src="${escapeHtml(book.cover_url)}" alt="">`
    : `<div class="cover-placeholder">
         <div class="title">${escapeHtml(book.title)}</div>
         <button data-slug="${escapeHtml(book.slug)}">Generate cover</button>
       </div>`;
  return `
    <div class="book-card" data-slug="${escapeHtml(book.slug)}">
      <div class="cover">${coverInner}</div>
      <div class="meta">
        <div class="title">${escapeHtml(book.title)}</div>
        <div class="author">${escapeHtml(book.author ?? "")}</div>
        <div class="genres">${(book.genres ?? []).map(escapeHtml).join(" · ")}</div>
      </div>
    </div>`;
}

function generateCover(slug, btn) {
  // Enqueue; don't block. The dock shows progress. The route handler's
  // queue listener re-renders when the job lands.
  JobQueue.enqueue({
    slug, kind: "cover", label: `${slug} · cover`,
  });
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Queued…`;
}

// ─── Book detail view ───────────────────────────────────────────────
async function renderBook(slug) {
  // Refresh when any cover/character/scene job lands.
  setRouteListener(() => renderBook(slug));
  let data;
  try {
    data = await api(`/api/books/${encodeURIComponent(slug)}`);
  } catch (e) {
    $("#app").innerHTML = `<div class="empty"><h2>Not found</h2><p>${escapeHtml(e.message)}</p></div>`;
    return;
  }
  setCrumbs({ href: `#/book/${encodeURIComponent(slug)}`, label: data.manifest.title || slug });

  const cover = data.cover || {};
  const coverKey = jobKey(slug, "cover", "");
  const coverRunning = isJobLive(coverKey);
  const coverImg = cover.status === "ready"
    ? `<img src="/api/books/${encodeURIComponent(slug)}/cover/png" alt="">`
    : coverRunning
      ? `<div class="cover-placeholder card-pending"><span class="spinner"></span><span>Generating cover…</span></div>`
      : `<div class="cover-placeholder card-pending"><span>Cover pending</span></div>`;

  $("#app").innerHTML = `
    <div class="book-detail">
      <div>
        <div class="cover-large">${coverImg}</div>
      </div>
      <div class="info">
        <h2>${escapeHtml(data.manifest.title)}</h2>
        <div class="author">${escapeHtml(data.manifest.author ?? "")}</div>
        <div class="description">${escapeHtml(data.manifest.description ?? (data.poster?.back_cover_copy ?? ""))}</div>
        <div class="genres">${(data.poster?.genres ?? []).map(escapeHtml).join(" · ")}</div>
        <div id="gen-all-host" style="margin-top:20px;"></div>
      </div>
    </div>

    ${data.cast.length ? `
      <div class="section-title">Cast</div>
      <div class="cast-strip">${data.cast.map(c => castCardHtml(slug, c)).join("")}</div>
    ` : ""}

    <div class="section-title">Chapters</div>
    <div class="chapter-list">${
      data.chunks.map((c, i) => `
        <div class="chapter-item" data-chunk="${escapeHtml(c.chunk_id)}">
          <div class="ch-num">Chapter ${i + 1}</div>
          <div class="ch-title">${escapeHtml(c.title ?? "Untitled")}</div>
        </div>
      `).join("")
    }</div>
  `;

  $$(".chapter-item").forEach(el => {
    el.addEventListener("click", () => {
      location.hash = `#/book/${encodeURIComponent(slug)}/chapter/${encodeURIComponent(el.dataset.chunk)}`;
    });
  });

  // "Generate everything" + "Sync to VM" — the two big actions for a book.
  // The gen-all panel is re-rendered on every dock-update so the operator
  // sees live progress (X of Y done, K in flight) without leaving the page.
  (async () => {
    let pending;
    try {
      pending = await api(`/api/books/${encodeURIComponent(slug)}/pending-images`);
    } catch {
      return;
    }
    const host = $("#gen-all-host");
    if (!host) return;

    // Snapshot the *initial* total at first render so we can show
    // "X of N done" as jobs land. `pending.counts.total` reflects
    // server-side state (still-pending on disk); we don't refetch
    // it on every dock tick — the route listener will re-render on
    // job completion, which re-runs this IIFE and resets the snapshot.
    const initialTotal = pending.counts.total + sumGenJobs(slug, "success");
    const totalToGen = pending.counts.total;

    function renderPanel() {
      const inflight = [...Q.inflight.values()].filter(j => j.slug === slug && j.kind !== "deploy");
      const queued   = Q.pending.filter(j => j.slug === slug && j.kind !== "deploy");
      const success  = Q.finished.filter(j => j.slug === slug && j.status === "success" && j.kind !== "deploy");
      const failed   = Q.finished.filter(j => j.slug === slug && j.status === "failed" && j.kind !== "deploy");

      const isRunning = inflight.length + queued.length > 0;
      const doneCount = success.length;
      const totalCount = initialTotal || (doneCount + inflight.length + queued.length + failed.length);
      const pct = totalCount > 0 ? Math.min(100, Math.round((doneCount / totalCount) * 100)) : 0;

      const breakdown = [
        pending.counts.cover      && "1 cover",
        pending.counts.characters && `${pending.counts.characters} character${pending.counts.characters === 1 ? "" : "s"}`,
        pending.counts.scenes     && `${pending.counts.scenes} scene${pending.counts.scenes === 1 ? "" : "s"}`,
      ].filter(Boolean).join(" · ");

      let genBlock;
      if (totalToGen === 0) {
        genBlock = `<div class="genres" style="color:var(--ok);">✓ All images generated.</div>`;
      } else if (isRunning) {
        const inflightLabels = inflight.slice(0, 4).map(j => {
          const elapsed = ((Date.now() - j.startedAt) / 1000).toFixed(0);
          return `<span class="run-chip"><span class="spinner"></span>${escapeHtml(shortLabel(j))} · ${elapsed}s</span>`;
        }).join("");
        const overflow = inflight.length > 4 ? `<span class="run-chip subtle">+${inflight.length - 4} more</span>` : "";
        genBlock = `
          <button id="gen-all-btn" class="gen-all-btn" disabled>
            <span class="spinner"></span> Generating ${doneCount} of ${totalCount}…
          </button>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;"></div></div>
          <div class="progress-meta">
            ${doneCount} done · ${inflight.length} in flight · ${queued.length} queued${failed.length ? ` · <span style="color:var(--danger);">${failed.length} failed</span>` : ""}
          </div>
          <div class="running-chips">${inflightLabels}${overflow}</div>
        `;
      } else {
        genBlock = `
          <button id="gen-all-btn" class="gen-all-btn">Generate all ${totalToGen} images</button>
          <div class="progress-meta">${breakdown}${failed.length ? ` · <span style="color:var(--danger);">${failed.length} failed last run — retry</span>` : ""}</div>
        `;
      }

      host.innerHTML = `
        <div class="gen-panel">${genBlock}</div>
        <div class="gen-panel-row" style="margin-top:14px;">
          <button id="sync-vm-btn" class="ghost-btn">Sync to VM &nbsp;↗</button>
          <span class="genres">Push to <code style="color:var(--accent);">inkspacex.com</code> · live in the Flutter app</span>
        </div>`;

      wireGenAll();
      wireSync();
    }

    function wireGenAll() {
      const genAll = $("#gen-all-btn");
      if (!genAll || genAll.disabled) return;
      genAll.addEventListener("click", async () => {
        // Ask the browser for notification permission once, on first
        // Generate-all click. If granted, we'll notify on batch complete
        // and on individual failures.
        await requestNotifyPermission();
        let queued = 0;
        if (pending.cover) {
          JobQueue.enqueue({ slug, kind: "cover", label: `${slug} · cover` });
          queued++;
        }
        for (const c of pending.characters) {
          JobQueue.enqueue({
            slug, kind: "character", targetId: c.name_slug,
            label: `${slug} · ${c.name}`,
          });
          queued++;
        }
        for (const s of pending.scenes) {
          JobQueue.enqueue({
            slug, kind: "scene", targetId: s.scene_id,
            label: `${slug} · ${s.scene_id.slice(0, 10)}`,
          });
          queued++;
        }
        toast(`Queued ${queued} images.`, "ok");
        // renderPanel() will be invoked by the dock-update event.
      });
    }

    function wireSync() {
      const syncBtn = $("#sync-vm-btn");
      if (!syncBtn) return;
      syncBtn.addEventListener("click", async () => {
        const total = pending.counts.total;
        let confirmMsg = `Push "${data.manifest.title}" to the production VM?\n\nThis will:`;
        if (total > 0) {
          confirmMsg += `\n  • Generate ${total} pending image${total === 1 ? "" : "s"} first (cover with title overlay, characters, scenes)`;
        }
        confirmMsg += `\n  • Tar artifacts and SFTP to azureuser@20.219.16.30`;
        confirmMsg += `\n  • Run sync_to_db.py inside the fastapi container (writes Postgres + MinIO)`;
        confirmMsg += `\n  • Live in the Flutter app within seconds`;
        if (!confirm(confirmMsg)) return;
        await requestNotifyPermission();
        // One-click flow: enqueue every missing image, then the deploy.
        // JobQueue runs them concurrently up to MAX_CONCURRENT; the
        // deploy waits for nothing on the client side — sync_to_db.py
        // reads whatever's on disk when the tarball is built, so any
        // job still in-flight at deploy time would ship as a gap.
        // Quick guard: kick the deploy only after generate jobs settle.
        if (pending.cover) {
          JobQueue.enqueue({ slug, kind: "cover", label: `${slug} · cover` });
        }
        for (const c of pending.characters) {
          JobQueue.enqueue({
            slug, kind: "character", targetId: c.name_slug,
            label: `${slug} · ${c.name}`,
          });
        }
        for (const s of pending.scenes) {
          JobQueue.enqueue({
            slug, kind: "scene", targetId: s.scene_id,
            label: `${slug} · ${s.scene_id.slice(0, 10)}`,
          });
        }
        if (total > 0) {
          toast(`Queued ${total} images + deploy. Deploy fires once images settle.`, "ok");
          await waitForSlugIdle(slug);
        }
        JobQueue.enqueue({ slug, kind: "deploy", label: `${slug} · sync to VM` });
        if (total === 0) toast("Deploy queued.", "ok");
      });
    }

    // Resolves when no scene/character/cover jobs for `slug` remain in
    // flight or pending. Polls the queue every 400ms — cheap, and the
    // queue events fire only when something changes anyway.
    function waitForSlugIdle(slug) {
      return new Promise(resolve => {
        const Q = window.__queue;
        const check = () => {
          const stillGoing = [
            ...Q.inflight.values(), ...Q.pending,
          ].some(j => j.slug === slug && j.kind !== "deploy");
          if (!stillGoing) resolve();
          else setTimeout(check, 400);
        };
        check();
      });
    }

    renderPanel();
    // The route listener (setRouteListener above) re-renders this whole
    // book detail on every dock-update, so we don't need a second
    // subscription — that would double-handle and leak. We only need a
    // 1-second tick so the elapsed-time chips on in-flight jobs stay
    // current between dock events. Replace any previous panel tick so
    // re-renders don't accumulate intervals.
    if (window._genPanelTick) clearInterval(window._genPanelTick);
    window._genPanelTick = setInterval(() => {
      // Only tick while in-flight jobs exist for this slug; otherwise
      // nothing on the panel needs updating.
      const live = [...Q.inflight.values()].some(j => j.slug === slug);
      if (live) renderPanel();
    }, 1000);
  })();

  // Old per-character "Generate" buttons removed — generation is driven
  // exclusively by the single "Generate all" action above. The cast
  // cards now render an idle placeholder or a spinner overlay based on
  // queue state (see castCardHtml + isJobLive). Re-rendering on
  // dock-update is handled by the route listener.
}

// ─── Browser notifications ─────────────────────────────────────────
// We notify the operator on individual job FAILURES (because those need
// attention) and once per slug when a batch completes (so they can come
// back to the tab from another window). Per-success notifications would
// be noise — the dock and progress panel already show that.

const _slugBatchSeen = new Map();   // slug → last in-flight count (used to detect 0-cross)

async function requestNotifyPermission() {
  if (!("Notification" in window)) return false;
  if (Notification.permission === "granted") return true;
  if (Notification.permission === "denied") return false;
  try {
    const p = await Notification.requestPermission();
    return p === "granted";
  } catch { return false; }
}

function notify(title, body, tag) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try {
    new Notification(title, { body, tag, icon: "/favicon.ico", silent: false });
  } catch {}
}

function notifyJob(job) {
  if (job.status === "failed") {
    notify(
      `✗ ${job.label}`,
      (job.error || "Generation failed.").slice(0, 180),
      `job-${job.id}`,
    );
  }
  // Successes: don't notify per-job — too noisy when Generate all kicks
  // off 20+ jobs. The batch-complete notification covers it.
}

function maybeNotifyBatchComplete(slug) {
  // Check if anything is still in flight or queued for this slug.
  // (Excludes deploy jobs — those announce separately.)
  const stillLive =
    [...Q.inflight.values()].some(j => j.slug === slug && j.kind !== "deploy") ||
    Q.pending.some(j => j.slug === slug && j.kind !== "deploy");
  const prev = _slugBatchSeen.get(slug) || 0;
  const now = stillLive ? 1 : 0;
  _slugBatchSeen.set(slug, now);
  if (prev === 1 && now === 0) {
    // We just crossed from "live work" to "no live work". Count how
    // many jobs of this slug landed in the most-recent finished batch.
    const success = Q.finished.filter(j => j.slug === slug && j.status === "success" && j.kind !== "deploy").length;
    const failed  = Q.finished.filter(j => j.slug === slug && j.status === "failed"  && j.kind !== "deploy").length;
    const title = failed > 0
      ? `${slug} — ${success} done, ${failed} failed`
      : `${slug} — all ${success} images ready`;
    notify(title, "Open the studio tab to review.", `batch-${slug}-${Date.now()}`);
  }
}

// Helper: short, human-friendly label for an in-flight job chip.
function shortLabel(job) {
  // Job label is "<slug> · <name>" — strip the leading slug to keep chips tight.
  const idx = (job.label || "").indexOf(" · ");
  if (idx !== -1) return job.label.slice(idx + 3);
  return job.label || job.kind;
}

// Helper: count this slug's finished jobs in a given status.
function sumGenJobs(slug, status) {
  return Q.finished.filter(j => j.slug === slug && j.status === status && j.kind !== "deploy").length;
}

function castCardHtml(slug, c) {
  // No per-card Generate button — generation is driven by the single
  // "Generate all" action on the book detail page. While a job is in
  // flight for this character, show a spinner overlay; otherwise an
  // empty pending placeholder.
  const key = jobKey(slug, "character", c.name_slug);
  const isRunning = isJobLive(key);
  const inner = c.status === "ready"
    ? `<img src="/api/books/${encodeURIComponent(slug)}/characters/${encodeURIComponent(c.name_slug)}/png" alt="">`
    : isRunning
      ? `<div class="card-pending"><span class="spinner"></span><span>Generating…</span></div>`
      : `<div class="card-pending"><span>Pending</span></div>`;
  return `
    <div class="cast-card${isRunning ? " is-running" : ""}">
      <div class="cast-portrait">${inner}</div>
      <div class="cast-name">${escapeHtml(c.name)}</div>
      <div class="cast-bio">${escapeHtml((c.bio || "").slice(0, 110))}${(c.bio || "").length > 110 ? "…" : ""}</div>
    </div>`;
}

// Is there a job in the queue (inflight OR pending) for this key?
function isJobLive(key) {
  for (const j of Q.inflight.values()) if (j.key === key) return true;
  for (const j of Q.pending) if (j.key === key) return true;
  return false;
}

// ─── Reader view (Delta → HTML) ─────────────────────────────────────
async function renderChapter(slug, chunkId) {
  // When a scene job lands while reading, refresh so the placeholder
  // card flips into the rendered <img>.
  setRouteListener(() => renderChapter(slug, chunkId));
  let bookData, section;
  try {
    [bookData, section] = await Promise.all([
      api(`/api/books/${encodeURIComponent(slug)}`),
      api(`/api/books/${encodeURIComponent(slug)}/sections/${encodeURIComponent(chunkId)}`),
    ]);
  } catch (e) {
    $("#app").innerHTML = `<div class="empty"><h2>Could not load chapter</h2><p>${escapeHtml(e.message)}</p></div>`;
    return;
  }
  setCrumbs(
    { href: `#/book/${encodeURIComponent(slug)}`, label: bookData.manifest.title || slug },
    { href: `#/book/${encodeURIComponent(slug)}/chapter/${encodeURIComponent(chunkId)}`,
      label: (bookData.chunks.find(c => c.chunk_id === chunkId)?.title) || "Chapter" }
  );

  const html = deltaToHtml(section.ops || [], slug);
  $("#app").innerHTML = `
    <div class="reader">
      ${html}
    </div>`;

  // No per-scene or chapter-level Generate buttons — generation is
  // exclusively driven by "Generate all" on the book detail page. Scene
  // cards in the rendered Delta show a spinner placeholder when a job
  // is in flight for them, or an idle "Pending" placeholder otherwise.
}

// Minimal Quill Delta renderer. Handles:
//   - text inserts with attributes: bold, italic, background (highlight), header, blockquote
//   - image inserts: {insert: {image: "/api/.../png"}} — fetched async; 404 → scene-card placeholder
function deltaToHtml(ops, slug) {
  // First pass: group text ops into lines (each newline closes a line).
  const lines = [];
  let buffer = "";
  let lineAttrs = {};
  const imageOps = []; // queued image placements

  for (const op of ops) {
    const ins = op.insert;
    if (typeof ins === "string") {
      const parts = ins.split("\n");
      for (let i = 0; i < parts.length; i++) {
        if (parts[i]) {
          buffer += inlineSpan(parts[i], op.attributes || {});
        }
        if (i < parts.length - 1) {
          lines.push({ html: buffer, attrs: op.attributes || lineAttrs });
          buffer = "";
          lineAttrs = {};
        }
      }
    } else if (ins && typeof ins === "object" && ins.image) {
      // Flush any text on the current line.
      if (buffer) {
        lines.push({ html: buffer, attrs: {} });
        buffer = "";
      }
      lines.push({ html: imagePlaceholderHtml(ins.image, slug), attrs: { block: "image" } });
    }
  }
  if (buffer) lines.push({ html: buffer, attrs: {} });

  // Second pass: collapse to HTML with paragraph/heading/blockquote blocks.
  let html = "";
  for (const line of lines) {
    const a = line.attrs || {};
    if (a.block === "image") {
      html += line.html;
    } else if (a.header) {
      const lvl = Math.max(1, Math.min(6, Number(a.header)));
      html += `<h${lvl}>${line.html}</h${lvl}>`;
    } else if (a.blockquote) {
      html += `<blockquote><p>${line.html}</p></blockquote>`;
    } else {
      html += line.html.trim() ? `<p>${line.html}</p>` : "";
    }
  }
  return html;
}

function inlineSpan(text, attrs) {
  let out = escapeHtml(text);
  if (attrs.bold) out = `<strong>${out}</strong>`;
  if (attrs.italic) out = `<em>${out}</em>`;
  if (attrs.background) {
    const safeColor = /^#[0-9a-fA-F]{3,8}$/.test(attrs.background) ? attrs.background : "transparent";
    out = `<mark style="background:${safeColor};color:inherit">${out}</mark>`;
  }
  return out;
}

// For images whose PNG may not exist yet, render a scene-card placeholder
// that triggers generation on click. We probe the URL with a HEAD request
// to decide between <img> and placeholder.
function imagePlaceholderHtml(url, slug) {
  // URL shape: /api/books/<slug>/images/<scene_id>/png — extract scene_id.
  const m = url.match(/\/api\/books\/[^/]+\/images\/([^/]+)\/png$/);
  if (!m) {
    return `<figure><img src="${escapeHtml(url)}" alt=""></figure>`;
  }
  const sceneId = m[1];
  // Use a probe: <img> with onerror falls back to a placeholder element
  // we hide/show via JS after render. Simpler: always render both and let
  // CSS handle, but cleanest is to emit a wrapper that swaps based on a
  // fetch probe done client-side after insertion.
  const wrapperId = `scene-wrap-${sceneId}`;
  // Defer probe to next tick after insertion.
  queueMicrotask(() => probeImage(wrapperId, url, sceneId));
  return `
    <figure id="${wrapperId}">
      <div class="scene-card" data-loading="1">
        <span class="spinner"></span>
        <span class="scene-hint">Checking…</span>
      </div>
    </figure>`;
}

async function probeImage(wrapperId, url, sceneId) {
  const wrap = document.getElementById(wrapperId);
  if (!wrap) return;
  try {
    const head = await fetch(url, { method: "HEAD" });
    if (head.ok) {
      wrap.innerHTML = `<img src="${escapeHtml(url)}" alt="">`;
      return;
    }
  } catch {}
  // 404 → render a placeholder. No per-scene Generate button: the only
  // entry point is the book-detail "Generate all". If a job is in flight
  // for this scene we show a spinner; otherwise an idle pending hint.
  const slug = location.hash.match(/^#\/book\/([^/]+)/)?.[1] ?? "";
  let hint = "";
  try {
    const meta = await api(`/api/books/${slug}/images/${encodeURIComponent(sceneId)}`);
    hint = (meta.scene_text || "").slice(0, 200);
  } catch {}
  const running = isJobLive(jobKey(slug, "scene", sceneId));
  wrap.innerHTML = `
    <div class="scene-card${running ? " is-running" : ""}">
      <div class="scene-hint">${escapeHtml(hint)}</div>
      <div class="scene-status">${running
        ? `<span class="spinner"></span><span>Generating…</span>`
        : `<span class="subtle">Pending — click "Generate all" on the book page</span>`
      }</div>
    </div>`;
}

// ─── Router ─────────────────────────────────────────────────────────
function route() {
  const h = location.hash || "#/";
  const mBook = h.match(/^#\/book\/([^/]+)$/);
  const mChap = h.match(/^#\/book\/([^/]+)\/chapter\/([^/]+)$/);
  if (mChap) return renderChapter(decodeURIComponent(mChap[1]), decodeURIComponent(mChap[2]));
  if (mBook) return renderBook(decodeURIComponent(mBook[1]));
  renderLibrary();
}
window.addEventListener("hashchange", route);
window.addEventListener("load", route);
</script>
