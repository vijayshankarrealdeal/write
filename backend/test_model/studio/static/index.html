<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Book Ingest Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f7f7f5;
    --panel-2: #efefec;
    --border: #d8d8d3;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #2563eb;
    --warn: #c2410c;
    --ok: #15803d;
    --highlight: #fff3a0;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
  aside {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 16px;
    overflow-y: auto;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  main { padding: 24px; max-width: 1180px; }
  h1 { font-size: 18px; margin: 0 0 12px; letter-spacing: .02em; }
  h2 { font-size: 14px; margin: 24px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
  h3 { font-size: 16px; margin: 0 0 6px; }
  button {
    background: var(--panel-2);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font: inherit;
  }
  button:hover { background: #e4e4e0; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  button.danger { background: #fee; border-color: #f3b3b3; color: var(--warn); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  input, select, textarea {
    background: var(--panel-2);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font: inherit;
    width: 100%;
  }
  textarea { min-height: 64px; resize: vertical; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .book-link {
    display: block;
    padding: 8px 10px;
    border-radius: 6px;
    color: var(--fg);
    cursor: pointer;
  }
  .book-link:hover, .book-link.active { background: var(--panel-2); }
  .book-link small { color: var(--muted); display: block; }
  .pill {
    display: inline-block;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--muted);
    margin-right: 4px;
  }
  .pill.done { color: var(--accent); border-color: var(--accent); }
  .pill.ok { color: var(--ok); border-color: var(--ok); }
  .pill.warn { color: var(--warn); border-color: var(--warn); }
  .progress-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .progress-grid .stat { background: var(--panel-2); border-radius: 6px; padding: 8px; text-align: center; }
  .progress-grid .stat strong { display: block; font-size: 18px; }
  .progress-grid .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tabs button {
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    background: transparent;
    padding: 8px 16px;
    color: var(--muted);
  }
  .tabs button.active { color: var(--fg); border-bottom-color: var(--accent); }
  .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .image-card { display: flex; flex-direction: column; gap: 6px; }
  .image-card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; background: #000; cursor: zoom-in; }
  .image-card small { color: var(--muted); display: block; }

  /* --- Reading view (Preview tab) ----------------------------- */
  .reader {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    height: calc(100vh - 220px);
    min-height: 480px;
  }
  .reader-toc {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px 0;
    background: var(--panel);
  }
  .reader-toc .toc-entry {
    padding: 6px 14px;
    cursor: pointer;
    border-left: 2px solid transparent;
    color: var(--muted);
    font-size: 13px;
  }
  .reader-toc .toc-entry:hover { background: var(--panel-2); color: var(--fg); }
  .reader-toc .toc-entry.active {
    color: var(--fg);
    border-left-color: var(--accent);
    background: var(--panel-2);
  }
  .reader-toc .toc-entry small { display: block; color: var(--muted); font-size: 11px; }
  .reader-body {
    overflow-y: auto;
    padding: 48px 64px;
    background: #fbfaf6;
  }
  .reader-page {
    max-width: 720px;
    margin: 0 auto;
  }
  .reader-page h1.book-title {
    font-size: 28px;
    margin: 0 0 4px;
    letter-spacing: .01em;
    text-align: center;
  }
  .reader-page .book-author {
    color: var(--muted);
    font-style: italic;
    margin-bottom: 48px;
    text-align: center;
  }
  .reader-page .chapter {
    margin-bottom: 64px;
    scroll-margin-top: 16px;
  }
  .reader-page .chapter h2.chapter-title {
    font-size: 22px;
    text-align: center;
    margin: 0 0 4px;
    letter-spacing: .02em;
    color: var(--fg);
    text-transform: none;
  }
  .reader-page .chapter .chapter-meta {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .15em;
    margin-bottom: 24px;
  }
  .reader-page .chapter-rule {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 0 auto 32px;
    width: 60px;
  }
  .reader-controls {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--muted);
    font-size: 12px;
    flex-wrap: wrap;
  }
  .reader-controls .gap { flex: 1; }
  .reader-controls input[type="range"] { width: 120px; }
  .reader-controls .toggle { cursor: pointer; user-select: none; }
  .reader-controls input[type="checkbox"] { width: auto; }

  /* Quill viewer overrides — make Quill output read like a real book.
     We mount Quill in read-only mode without the toolbar; .ql-container
     is what we restyle. */
  .ql-viewer .ql-container {
    border: none;
    font-family: "Iowan Old Style", ui-serif, Georgia, "Times New Roman", serif;
  }
  .ql-viewer .ql-editor {
    padding: 0;
    color: #232323;
    font-family: "Iowan Old Style", ui-serif, Georgia, "Times New Roman", serif;
    line-height: 1.75;
  }
  .ql-viewer .ql-editor p {
    margin: 0 0 14px;
    text-align: justify;
    hyphens: auto;
  }
  .ql-viewer .ql-editor p img {
    max-width: 100%;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.12);
    display: block;
    margin: 24px auto 0;
  }
  /* If a paragraph contains only an image, drop its bottom margin so the
     italic-small caption sits flush underneath. */
  .ql-viewer .ql-editor p:has(img) { margin-bottom: 6px; text-align: center; }
  .ql-viewer .ql-editor p:has(+ p em) {}
  .ql-viewer .ql-editor .ql-size-small,
  .ql-viewer .ql-editor [style*="font-size: small"] {
    font-size: .85em;
    color: var(--muted);
  }
  /* Drop-cap on the very first paragraph of each chapter (skip if it's an
     italic summary or starts with an image). */
  .reader-page .chapter .ql-viewer .ql-editor p:first-child:not(:has(img)):not(:has(em:only-child))::first-letter {
    float: left;
    font-size: 3.4em;
    line-height: 0.9;
    padding: 4px 8px 0 0;
    color: var(--accent);
    font-weight: 600;
  }

  /* Inline Quill viewer used inside chunk detail and pages. */
  .ql-viewer.compact .ql-editor { font-size: 15px; line-height: 1.65; padding: 12px 0; }
  .ql-viewer.compact .ql-editor p img { max-width: 100%; }

  .page-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 8px; }
  .page-card .page-no { font-size: 11px; color: var(--muted); }
  .page-card pre { margin: 0; white-space: pre-wrap; font-family: inherit; font-size: 13px; }
  .chunk-row {
    display: grid;
    grid-template-columns: 1fr 60px 60px;
    gap: 8px;
    align-items: center;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .chunk-row:hover { background: var(--panel-2); }
  .chunk-row.active { background: var(--panel-2); }
  .chunk-row small { color: var(--muted); }
  .scroll { max-height: 70vh; overflow-y: auto; }
  .muted { color: var(--muted); }
  .err { color: var(--warn); }
  details summary { cursor: pointer; color: var(--muted); padding: 4px 0; }

  /* Lightbox for image preview. */
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; cursor: zoom-out;
    padding: 24px;
  }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  /* Toast feedback. */
  .toast-wrap {
    position: fixed; bottom: 24px; right: 24px; z-index: 1100;
    display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  .toast {
    background: #2a2a2a; color: #fff; padding: 10px 14px;
    border-radius: 6px; font-size: 13px; max-width: 320px;
    box-shadow: 0 8px 24px rgba(0,0,0,.2);
    pointer-events: auto;
  }
  .toast.err { background: var(--warn); }
  .toast.ok { background: var(--ok); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const { useState, useEffect, useCallback, useMemo, useRef, createContext, useContext } = React;

const api = (path, opts = {}) => fetch(path, opts).then(r => r.ok ? r.json() : Promise.reject(r));

// ----- Toast system ----------------------------------------------------
const ToastCtx = createContext(() => {});
function ToastProvider({ children }) {
  const [items, setItems] = useState([]);
  const push = useCallback((message, kind = "info") => {
    const id = Math.random().toString(36).slice(2);
    setItems(xs => [...xs, { id, message, kind }]);
    setTimeout(() => setItems(xs => xs.filter(x => x.id !== id)), 4000);
  }, []);
  return (
    <ToastCtx.Provider value={push}>
      {children}
      <div className="toast-wrap">
        {items.map(t => <div key={t.id} className={"toast " + t.kind}>{t.message}</div>)}
      </div>
    </ToastCtx.Provider>
  );
}
const useToast = () => useContext(ToastCtx);

// ----- Quill viewer ----------------------------------------------------
// Mount a read-only Quill instance and feed it a Delta. Re-renders ops
// via setContents — no toolbar, no editing affordances. This is what
// guarantees the studio preview matches what flutter_quill renders.
function QuillViewer({ ops, className = "", compact = false }) {
  const hostRef = useRef(null);
  const quillRef = useRef(null);

  useEffect(() => {
    if (!hostRef.current) return;
    if (!quillRef.current) {
      quillRef.current = new Quill(hostRef.current, {
        readOnly: true,
        modules: { toolbar: false },
        theme: "snow",
      });
      // Strip the toolbar slot (Quill adds an empty one even with toolbar:false in some builds).
      const tb = hostRef.current.parentElement?.querySelector(".ql-toolbar");
      if (tb) tb.remove();
    }
    const safeOps = Array.isArray(ops) && ops.length ? ops : [{ insert: "\n" }];
    try {
      quillRef.current.setContents({ ops: safeOps }, "silent");
    } catch (e) {
      console.error("Quill setContents failed", e, safeOps);
    }
  }, [ops]);

  return (
    <div className={"ql-viewer " + (compact ? "compact " : "") + className}>
      <div ref={hostRef} />
    </div>
  );
}

// ----- App shell -------------------------------------------------------
function App() {
  const [books, setBooks] = useState([]);
  const [selectedSlug, setSelectedSlug] = useState(null);

  const refreshBooks = useCallback(async () => {
    const j = await api("/api/books").catch(() => ({ books: [] }));
    setBooks(j.books || []);
  }, []);
  useEffect(() => { refreshBooks(); }, [refreshBooks]);

  return (
    <ToastProvider>
      <div className="app">
        <aside>
          <h1>Book Studio</h1>
          <UploadForm onUploaded={async (slug) => { await refreshBooks(); setSelectedSlug(slug); }} />
          <h2>Books on disk</h2>
          <div className="stack">
            {books.length === 0 && <div className="muted">No books yet. Upload a PDF.</div>}
            {books.map(b => (
              <div
                key={b.slug}
                className={"book-link " + (b.slug === selectedSlug ? "active" : "")}
                onClick={() => setSelectedSlug(b.slug)}
              >
                {b.title || b.slug}
                <small>
                  {b.slug}
                  {b.synced && <span className="pill ok">synced</span>}
                </small>
              </div>
            ))}
          </div>
        </aside>
        <main>
          {selectedSlug
            ? <BookView key={selectedSlug} slug={selectedSlug} onSynced={refreshBooks} />
            : <div className="muted">Select or upload a book.</div>}
        </main>
      </div>
    </ToastProvider>
  );
}

// ----- Upload ----------------------------------------------------------
function UploadForm({ onUploaded }) {
  const toast = useToast();
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [info, setInfo] = useState(null);
  const [params, setParams] = useState({
    image_budget: "",
    style: "",
    reader_preference: "",
  });
  const fileRef = useRef(null);

  const submit = async (e) => {
    e.preventDefault();
    if (!fileRef.current?.files?.[0]) return;
    setBusy(true); setErr(null); setInfo(null);
    try {
      const fd = new FormData();
      fd.append("file", fileRef.current.files[0]);
      const qs = new URLSearchParams();
      if (params.image_budget) qs.set("image_budget", params.image_budget);
      if (params.style.trim()) qs.set("style", params.style);
      if (params.reader_preference.trim()) qs.set("reader_preference", params.reader_preference);
      const r = await fetch(`/api/upload?${qs}`, { method: "POST", body: fd });
      if (!r.ok) throw new Error(await r.text());
      const j = await r.json();
      const msg = j.resumed
        ? `Resumed "${j.title}" (${j.source_hash.slice(0,10)}…).`
        : `New book "${j.title}" — scout will propose style + budget after chunking.`;
      setInfo(msg);
      toast(msg, "ok");
      onUploaded(j.slug);
    } catch (e) {
      setErr(String(e));
      toast("Upload failed: " + String(e), "err");
    }
    finally { setBusy(false); }
  };

  return (
    <form onSubmit={submit} className="card" style={{ marginBottom: 16 }}>
      <label>PDF</label>
      <input type="file" accept=".pdf" ref={fileRef} required />
      <label>Image budget <span className="muted" style={{ fontWeight: 400 }}>(blank → auto)</span></label>
      <input type="number" value={params.image_budget}
        placeholder="auto-decide (10–120)"
        onChange={e => setParams(p => ({ ...p, image_budget: e.target.value }))} />
      <label>Style <span className="muted" style={{ fontWeight: 400 }}>(blank → auto)</span></label>
      <input value={params.style}
        placeholder="auto — scout picks based on the book"
        onChange={e => setParams(p => ({ ...p, style: e.target.value }))} />
      <label>Reader preference <span className="muted" style={{ fontWeight: 400 }}>(blank → auto)</span></label>
      <textarea value={params.reader_preference}
        onChange={e => setParams(p => ({ ...p, reader_preference: e.target.value }))}
        placeholder="auto — leave blank unless you want to bias scene picks"
      />
      <div style={{ marginTop: 12 }}>
        <button className="primary" disabled={busy} type="submit">
          {busy ? "Uploading…" : "Upload + ingest"}
        </button>
      </div>
      {err && <div className="err" style={{ marginTop: 8 }}>{err}</div>}
      {info && <div className="muted" style={{ marginTop: 8, fontSize: 12 }}>{info}</div>}
    </form>
  );
}

// ----- Book view -------------------------------------------------------
function BookView({ slug, onSynced }) {
  const [book, setBook] = useState(null);
  const [progress, setProgress] = useState(null);
  const [tab, setTab] = useState("preview");

  const loadBook = useCallback(async () => {
    setBook(await api(`/api/books/${slug}`));
  }, [slug]);

  useEffect(() => { loadBook(); }, [loadBook]);

  // Progress polling — uses a ref to avoid the stale-closure bug in the
  // previous version, which permanently stopped polling once `progress`
  // briefly evaluated to "done"/"failed" on the wrong tick.
  const phaseRef = useRef(null);
  useEffect(() => {
    let alive = true;
    let timer = null;
    const tick = async () => {
      if (!alive) return;
      try {
        const p = await api(`/api/books/${slug}/progress`);
        if (!alive) return;
        setProgress(p);
        phaseRef.current = p.phase;
      } catch { /* swallow */ }
      const done = phaseRef.current === "done" || phaseRef.current === "failed";
      timer = setTimeout(tick, done ? 8000 : 2000);
    };
    tick();
    return () => { alive = false; if (timer) clearTimeout(timer); };
  }, [slug]);

  // When the run finishes, re-fetch the book.
  const lastPhase = useRef(null);
  useEffect(() => {
    if (progress?.phase === "done" && lastPhase.current !== "done") {
      loadBook();
    }
    lastPhase.current = progress?.phase;
  }, [progress?.phase, loadBook]);

  if (!book) return <div className="muted">Loading…</div>;

  const m = book.manifest;
  return (
    <div>
      <div className="card">
        <div className="row" style={{ justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <h3>{m.title || slug}</h3>
            <small className="muted">
              {slug}
              {" · budget "}{m.image_budget || "?"}
              {" · "}{m.style || "(no style yet)"}
            </small>
          </div>
          <SyncPanel slug={slug} synced={!!m.synced}
            onSynced={async () => { await loadBook(); onSynced?.(); }}
            onCleaned={loadBook}
          />
        </div>
        {m.scout && <ScoutCard scout={m.scout} reader_preference={m.reader_preference} />}
        {progress && <ProgressStrip progress={progress} />}
      </div>

      <div className="tabs">
        {[
          ["preview", "Preview"],
          ["chunks", "Chunks"],
          ["images", "Images"],
          ["pages", "Pages"],
        ].map(([k, label]) => (
          <button key={k} className={tab === k ? "active" : ""} onClick={() => setTab(k)}>
            {label}
          </button>
        ))}
      </div>

      {tab === "preview" && <PreviewTab slug={slug} />}
      {tab === "chunks"  && <ChunksTab slug={slug} chunks={book.chunks} />}
      {tab === "pages"   && <PagesTab slug={slug} />}
      {tab === "images"  && <ImagesTab slug={slug} />}
    </div>
  );
}

function ScoutCard({ scout, reader_preference }) {
  return (
    <div style={{
      marginTop: 12,
      padding: 10,
      background: "var(--panel-2)",
      border: "1px solid var(--border)",
      borderRadius: 6,
      fontSize: 13,
    }}>
      <div className="muted" style={{ fontSize: 11, textTransform: "uppercase",
        letterSpacing: ".1em", marginBottom: 6 }}>
        Scout proposal
      </div>
      <div><strong>Genre:</strong> {scout.detected_genre}
        {scout.cultural_context && <span className="muted"> · {scout.cultural_context}</span>}
      </div>
      <div style={{ marginTop: 4 }}><strong>Style:</strong> {scout.suggested_style}</div>
      {(reader_preference || scout.suggested_reader_preference) && (
        <div style={{ marginTop: 4 }}>
          <strong>Reader bias:</strong> {reader_preference || scout.suggested_reader_preference}
        </div>
      )}
      <div style={{ marginTop: 4 }}><strong>Budget:</strong> {scout.suggested_image_budget} illustrations</div>
      <div style={{ marginTop: 6, fontStyle: "italic", color: "var(--muted)" }}>
        {scout.rationale}
      </div>
    </div>
  );
}

function ProgressStrip({ progress }) {
  const stats = [
    ["pages",   progress.n_pages,            "PyMuPDF-extracted page text (pages/<n>.json)"],
    ["briefs",  progress.n_briefs,           "Map-pass output: 1-line summary + importance per chunk"],
    ["deeps",   progress.n_deeps,            "Reduce-pass output: rich summary + highlights for top ~20% chunks"],
    ["chk-emb", progress.n_chunk_embeddings, "Per-chunk vector embeddings — power semantic regen"],
    ["scn-emb", progress.n_scene_embeddings, "Per-scene vector embeddings — find scenes by free text"],
    ["images",  progress.n_images,           "Generated illustrations (PNG)"],
  ];
  const phasePill = {
    queued: "warn", running: "warn", resuming: "warn",
    done: "ok", failed: "warn",
  }[progress.phase] || "";
  return (
    <div style={{ marginTop: 16 }}>
      <div className="row" style={{ marginBottom: 8 }}>
        <strong>Phase:</strong> <span className={"pill " + phasePill}>{progress.phase}</span>
        {(progress.phases_done || []).map(p => <span key={p} className="pill done">{p}</span>)}
      </div>
      {progress.error && <div className="err">{progress.error}</div>}
      <div className="progress-grid">
        {stats.map(([k, v, tip]) => (
          <div key={k} className="stat" title={tip}><strong>{v}</strong><span>{k}</span></div>
        ))}
      </div>
    </div>
  );
}

function SyncPanel({ slug, synced, onSynced, onCleaned }) {
  const toast = useToast();
  const [busy, setBusy] = useState(false);
  const [out, setOut] = useState(null);
  const [cleaning, setCleaning] = useState(false);
  const [cleaned, setCleaned] = useState(null);
  const [confirmSync, setConfirmSync] = useState(false);

  const click = async () => {
    if (synced && !confirmSync) {
      setConfirmSync(true);
      return;
    }
    setConfirmSync(false);
    setBusy(true); setOut(null);
    try {
      const r = await fetch(`/api/books/${slug}/sync`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ force: synced, no_images: false }),
      });
      const j = await r.json();
      setOut(j);
      if (j.ok) {
        toast(synced ? "Re-sync complete" : "Synced to DB + MinIO", "ok");
        onSynced?.();
      } else {
        toast("Sync failed (exit " + j.exit + ")", "err");
      }
    } catch (e) {
      toast("Sync error: " + String(e), "err");
    } finally { setBusy(false); }
  };

  const cleanOrphans = async () => {
    setCleaning(true); setCleaned(null);
    try {
      const r = await fetch(`/api/books/${slug}/cleanup-orphans`, { method: "POST" });
      if (!r.ok) throw new Error(await r.text());
      const j = await r.json();
      setCleaned(j);
      if (j.total_removed > 0) toast(`Removed ${j.total_removed} orphans`, "ok");
      else toast("No orphans found", "info");
      onCleaned?.();
    } catch (e) {
      setCleaned({ error: String(e) });
      toast("Cleanup failed: " + String(e), "err");
    }
    finally { setCleaning(false); }
  };

  return (
    <div style={{ textAlign: "right" }}>
      <div className="row" style={{ justifyContent: "flex-end", gap: 8 }}>
        <button disabled={cleaning} onClick={cleanOrphans} title="Delete stale brief/deep/chunk/embedding files left behind by older random-UUID chunker runs.">
          {cleaning ? "Cleaning…" : "Clean orphans"}
        </button>
        {confirmSync ? (
          <>
            <button onClick={() => setConfirmSync(false)}>Cancel</button>
            <button className="danger" onClick={click}>
              Confirm re-sync
            </button>
          </>
        ) : (
          <button className="primary" disabled={busy} onClick={click}>
            {busy ? "Syncing…" : (synced ? "Re-sync (force)" : "Sync to DB + MinIO")}
          </button>
        )}
      </div>
      {cleaned && !cleaned.error && (
        <div className="muted" style={{ marginTop: 6, fontSize: 12 }}>
          Removed {cleaned.total_removed} orphans
          {" · "}{cleaned.chunks_kept} chunks kept
          {" · "}briefs:{cleaned.removed.briefs}
          {" deeps:"}{cleaned.removed.deeps}
          {" chunks:"}{cleaned.removed.chunks}
          {" emb:"}{cleaned.removed.chunk_embeddings}
        </div>
      )}
      {cleaned?.error && <div className="err" style={{ marginTop: 6, fontSize: 12 }}>{cleaned.error}</div>}
      {out && (
        <details style={{ marginTop: 6, textAlign: "left" }}>
          <summary>Sync output (exit {out.exit})</summary>
          <pre style={{ fontSize: 11, maxHeight: 240, overflow: "auto" }}>{out.output}</pre>
        </details>
      )}
    </div>
  );
}

// ----- Chunks tab ------------------------------------------------------
function ChunksTab({ slug, chunks }) {
  const [active, setActive] = useState(null);
  const [detail, setDetail] = useState(null);
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    if (!active) return;
    setDetail(null);
    setLoading(true);
    api(`/api/books/${slug}/chunks/${active}`)
      .then(setDetail)
      .finally(() => setLoading(false));
  }, [active, slug]);

  return (
    <div className="row" style={{ alignItems: "stretch", gap: 16 }}>
      <div className="card scroll" style={{ flex: "0 0 320px", padding: 0 }}>
        <div style={{ padding: 12, borderBottom: "1px solid var(--border)", color: "var(--muted)" }}>
          {chunks.length} chunks
        </div>
        {chunks.map(c => (
          <div key={c.id}
            className={"chunk-row " + (active === c.id ? "active" : "")}
            onClick={() => setActive(c.id)}>
            <div>
              <div>{c.chapter_title || <em className="muted">Untitled</em>}</div>
              <small>p {c.page_start}–{c.page_end} · {c.char_count.toLocaleString()} chars</small>
            </div>
            <small className="muted">{c.has_brief ? "B" : "·"}{c.has_deep ? "D" : "·"}</small>
            <small className="muted">{c.scene_ids.length}🖼</small>
          </div>
        ))}
      </div>
      <div className="card scroll" style={{ flex: 1 }}>
        {!active && <div className="muted">Pick a chunk to see its rendered Delta and scene images.</div>}
        {active && loading && <div className="muted">Loading chunk…</div>}
        {detail && <ChunkDetail slug={slug} detail={detail} />}
      </div>
    </div>
  );
}

function ChunkDetail({ slug, detail }) {
  const c = detail.chunk;
  const brief = detail.brief;
  const deep = detail.deep;
  return (
    <div>
      <h3>
        {c.chapter_title || "(untitled)"}{" "}
        <small className="muted">p {c.page_start}–{c.page_end}</small>
      </h3>
      {brief && (
        <div style={{ marginBottom: 8 }}>
          <strong>{brief.summary_1line}</strong>
          <div className="muted" style={{ fontSize: 12 }}>
            importance: {Number(brief.importance ?? 0).toFixed(2)}
            {brief.themes?.length ? " · " + brief.themes.join(", ") : ""}
          </div>
        </div>
      )}

      {/* Live Quill render of the chunk's Delta — what flutter_quill will
          actually display once Section.content is written by sync_to_db. */}
      <div style={{ marginTop: 16 }}>
        <div className="muted" style={{ fontSize: 11, textTransform: "uppercase",
          letterSpacing: ".1em", marginBottom: 6 }}>
          Quill preview
        </div>
        <div style={{ background: "#fbfaf6", border: "1px solid var(--border)",
          borderRadius: 8, padding: "16px 20px" }}>
          <QuillViewer ops={detail.delta} compact />
        </div>
      </div>

      {!!detail.scenes?.length && (
        <div style={{ marginTop: 24 }}>
          <div className="muted" style={{ fontSize: 11, textTransform: "uppercase",
            letterSpacing: ".1em", marginBottom: 8 }}>
            {detail.scenes.length} scene image{detail.scenes.length === 1 ? "" : "s"}
          </div>
          <div className="image-grid">
            {detail.scenes.map(s => (
              <ImageCard key={s.scene_id} slug={slug} scene={s} />
            ))}
          </div>
        </div>
      )}

      {deep && !!deep.highlight_spans?.length && (
        <details style={{ marginTop: 16 }}>
          <summary>{deep.highlight_spans.length} highlight spans</summary>
          <ul>
            {deep.highlight_spans.map((s, i) => (
              <li key={i}>“{c.text.slice(s.start, s.start + s.length)}” — {s.why}</li>
            ))}
          </ul>
        </details>
      )}
      <details style={{ marginTop: 16 }}>
        <summary>Raw chunk text ({c.text.length.toLocaleString()} chars)</summary>
        <pre style={{ whiteSpace: "pre-wrap", fontFamily: "inherit", fontSize: 13 }}>{c.text}</pre>
      </details>
    </div>
  );
}

// ----- Image card with lightbox + regen -------------------------------
function Lightbox({ src, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  return (
    <div className="lightbox" onClick={onClose}>
      <img src={src} alt="" />
    </div>
  );
}

function ImageCard({ slug, scene }) {
  const toast = useToast();
  const [open, setOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  const [instr, setInstr] = useState("");
  const [err, setErr] = useState(null);
  const [bust, setBust] = useState(0);
  const [zoom, setZoom] = useState(false);

  const url = `/api/books/${slug}/images/${scene.scene_id}/png?v=${bust}`;
  const regen = async () => {
    setBusy(true); setErr(null);
    try {
      const r = await fetch(`/api/books/${slug}/images/${scene.scene_id}/regenerate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ instruction: instr }),
      });
      if (!r.ok) throw new Error(await r.text());
      setBust(Date.now());
      setOpen(false);
      setInstr("");
      toast("Image regenerated", "ok");
    } catch (e) {
      setErr(String(e));
      toast("Regen failed: " + String(e), "err");
    }
    finally { setBusy(false); }
  };

  const pageLabel = scene.page_start == null
    ? null
    : (scene.page_start === scene.page_end
       ? `p ${scene.page_start}`
       : `p ${scene.page_start}–${scene.page_end}`);

  return (
    <div className="image-card card" style={{ marginBottom: 0 }}>
      <img src={url} alt={scene.scene_text || ""} loading="lazy" onClick={() => setZoom(true)} />
      {zoom && <Lightbox src={url} onClose={() => setZoom(false)} />}
      <div style={{ display: "flex", justifyContent: "space-between", gap: 6, marginTop: 6 }}>
        {pageLabel && <span className="pill" style={{ margin: 0 }}>{pageLabel}</span>}
        {scene.chapter_title && <small className="muted" style={{ textAlign: "right" }}>{scene.chapter_title}</small>}
      </div>
      <small><em>{scene.scene_text}</em></small>
      <small className="muted">
        score {Number(scene.score || 0).toFixed(2)}
        {" · revisions "}{scene.revision_count || 0}
      </small>
      {!open && <button onClick={() => setOpen(true)}>Fix recommendation</button>}
      {open && (
        <div className="stack" style={{ marginTop: 8 }}>
          <textarea
            placeholder="e.g. darker, more dramatic lighting"
            value={instr}
            onChange={e => setInstr(e.target.value)}
            disabled={busy}
          />
          <div className="row">
            <button className="primary" disabled={busy} onClick={regen}>
              {busy ? "Generating…" : "Regenerate"}
            </button>
            <button onClick={() => { setOpen(false); setInstr(""); setErr(null); }} disabled={busy}>
              Cancel
            </button>
          </div>
          {err && <div className="err">{err}</div>}
        </div>
      )}
    </div>
  );
}

// ----- Pages tab -------------------------------------------------------
function PagesTab({ slug }) {
  const [pages, setPages] = useState([]);
  const [active, setActive] = useState(null);
  const [page, setPage] = useState(null);
  const [filter, setFilter] = useState("");

  useEffect(() => { api(`/api/books/${slug}/pages`).then(j => setPages(j.pages)); }, [slug]);
  useEffect(() => {
    if (!active) return;
    setPage(null);
    api(`/api/books/${slug}/pages/${active}`).then(setPage);
  }, [active, slug]);

  const filtered = useMemo(() => {
    if (!filter.trim()) return pages;
    const n = parseInt(filter, 10);
    if (Number.isFinite(n)) return pages.filter(p => String(p).includes(filter));
    return pages;
  }, [pages, filter]);

  return (
    <div className="row" style={{ alignItems: "stretch", gap: 16 }}>
      <div className="card scroll" style={{ flex: "0 0 160px", padding: 8 }}>
        <input
          placeholder="page #"
          value={filter}
          onChange={e => setFilter(e.target.value)}
          style={{ marginBottom: 8 }}
        />
        {filtered.map(n => (
          <div key={n} className={"book-link " + (n === active ? "active" : "")} onClick={() => setActive(n)}>
            p {n}
          </div>
        ))}
        {filtered.length === 0 && <div className="muted" style={{ padding: 8 }}>No matches.</div>}
      </div>
      <div className="card scroll" style={{ flex: 1 }}>
        {!active && <div className="muted">Pick a page.</div>}
        {page && (
          <div>
            <div className="muted">Page {page.no} · {page.char_count} chars</div>
            <pre style={{ whiteSpace: "pre-wrap", fontFamily: "inherit", marginTop: 12 }}>{page.text}</pre>
          </div>
        )}
      </div>
    </div>
  );
}

// ----- Images tab ------------------------------------------------------
function ImagesTab({ slug }) {
  const [images, setImages] = useState([]);
  const [sortBy, setSortBy] = useState("page");  // "page" | "score"
  const [refreshKey, setRefreshKey] = useState(0);

  useEffect(() => {
    api(`/api/books/${slug}/images`).then(j => setImages(j.images || []));
  }, [slug, refreshKey]);

  const groups = useMemo(() => {
    const m = new Map();
    for (const img of images) {
      const key = img.page_start == null
        ? "?"
        : (img.page_start === img.page_end ? `${img.page_start}` : `${img.page_start}–${img.page_end}`);
      if (!m.has(key)) {
        m.set(key, {
          range: key,
          page_start: img.page_start ?? 0,
          chapter_title: img.chapter_title,
          count: 0,
        });
      }
      m.get(key).count += 1;
    }
    return Array.from(m.values()).sort((a, b) => a.page_start - b.page_start);
  }, [images]);

  const sorted = useMemo(() => {
    const copy = [...images];
    if (sortBy === "page") {
      copy.sort((a, b) => (a.page_start ?? 9e9) - (b.page_start ?? 9e9));
    } else {
      copy.sort((a, b) => (b.score ?? 0) - (a.score ?? 0));
    }
    return copy;
  }, [images, sortBy]);

  return (
    <div>
      {groups.length > 0 && (
        <div className="card" style={{ padding: 12 }}>
          <div className="muted" style={{ fontSize: 11, textTransform: "uppercase",
            letterSpacing: ".1em", marginBottom: 8 }}>
            {images.length} images across {groups.length} page ranges
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {groups.map(g => (
              <span key={g.range} className="pill" title={g.chapter_title || ""}>
                p {g.range} · {g.count}🖼
              </span>
            ))}
          </div>
        </div>
      )}
      <div className="row" style={{ marginBottom: 12, alignItems: "center", gap: 8 }}>
        <span className="muted">sort by:</span>
        <button className={sortBy === "page" ? "primary" : ""} onClick={() => setSortBy("page")}>page</button>
        <button className={sortBy === "score" ? "primary" : ""} onClick={() => setSortBy("score")}>score</button>
        <span className="gap" style={{ flex: 1 }} />
        <button onClick={() => setRefreshKey(k => k + 1)}>Refresh</button>
      </div>
      <div className="image-grid">
        {sorted.map(img => (
          <ImageCard key={img.scene_id} slug={slug} scene={img} />
        ))}
        {images.length === 0 && <div className="muted">No images yet.</div>}
      </div>
    </div>
  );
}

// ----- Preview tab (full-book Quill render) ---------------------------
function PreviewTab({ slug }) {
  const [book, setBook] = useState(null);
  const [err, setErr] = useState(null);
  const [active, setActive] = useState(null);
  const [fontSize, setFontSize] = useState(17);
  const [showHighlights, setShowHighlights] = useState(true);
  const [maxWidth, setMaxWidth] = useState(720);
  const bodyRef = useRef(null);

  useEffect(() => {
    setBook(null); setActive(null); setErr(null);
    api(`/api/books/${slug}/delta`)
      .then((b) => {
        setBook(b);
        if (b.chapters?.[0]) setActive(b.chapters[0].id);
      })
      .catch((e) => setErr("Failed to load preview: " + String(e)));
  }, [slug]);

  useEffect(() => {
    if (!book || !bodyRef.current) return;
    const root = bodyRef.current;
    const obs = new IntersectionObserver(
      (entries) => {
        const visible = entries
          .filter(e => e.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio);
        if (visible[0]) setActive(visible[0].target.dataset.chapterId);
      },
      { root, rootMargin: "-30% 0px -55% 0px", threshold: [0, .25, .5, 1] }
    );
    root.querySelectorAll("[data-chapter-id]").forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, [book]);

  const jumpTo = (id) => {
    const el = bodyRef.current?.querySelector(`[data-chapter-id="${id}"]`);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  if (err) return <div className="err">{err}</div>;
  if (!book) return <div className="muted">Loading book…</div>;
  if (!book.chapters?.length) return <div className="muted">No chapters rendered yet — wait for ingest to finish.</div>;

  return (
    <div>
      <div className="reader-controls">
        <span>{book.chapters.length} chapter{book.chapters.length === 1 ? "" : "s"}</span>
        <span className="gap" />
        <label className="toggle">
          <input type="checkbox" checked={showHighlights}
            onChange={e => setShowHighlights(e.target.checked)} />
          {' highlights'}
        </label>
        <span>·</span>
        <span>font</span>
        <input type="range" min="14" max="24" value={fontSize}
          onChange={e => setFontSize(+e.target.value)} />
        <span>{fontSize}px</span>
        <span>·</span>
        <span>width</span>
        <input type="range" min="560" max="960" step="20" value={maxWidth}
          onChange={e => setMaxWidth(+e.target.value)} />
        <span>{maxWidth}px</span>
      </div>
      <div className="reader">
        <nav className="reader-toc">
          {book.chapters.map((c, i) => (
            <div
              key={c.id}
              className={"toc-entry " + (active === c.id ? "active" : "")}
              onClick={() => jumpTo(c.id)}
            >
              <div>{c.title || <em>Chapter {i + 1}</em>}</div>
              <small>
                p {c.page_start}–{c.page_end}
                {c.scene_ids?.length ? ` · ${c.scene_ids.length}🖼` : ""}
              </small>
            </div>
          ))}
        </nav>
        <div className="reader-body" ref={bodyRef}>
          <article className="reader-page" style={{ fontSize, maxWidth }}>
            <h1 className="book-title">{book.title}</h1>
            {book.author && <div className="book-author">by {book.author}</div>}
            {book.chapters.map((c, i) => (
              <LazyChapter
                key={c.id}
                chapter={c}
                index={i}
                rootRef={bodyRef}
                showHighlights={showHighlights}
              />
            ))}
          </article>
        </div>
      </div>
    </div>
  );
}

// LazyChapter — mounts a placeholder div whose height is estimated from
// the chapter's char count. When near the viewport, it mounts a real
// Quill viewer with the chapter's ops. Stays mounted afterward so users
// can scroll back without re-rendering.
function LazyChapter({ chapter, index, rootRef, showHighlights }) {
  const [mounted, setMounted] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    if (mounted || !ref.current || !rootRef.current) return;
    const obs = new IntersectionObserver(
      (entries) => {
        for (const e of entries) {
          if (e.isIntersecting) { setMounted(true); break; }
        }
      },
      { root: rootRef.current, rootMargin: "1500px 0px" }
    );
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, [mounted, rootRef]);

  const charCount = chapter.char_count ?? (chapter.ops?.reduce(
    (s, op) => s + (typeof op.insert === "string" ? op.insert.length : 600),
    0,
  ) || 1000);
  const placeholderH = Math.max(380, Math.min(12000, charCount * 0.35));

  // When highlights are off, strip background attributes from the ops
  // before handing them to Quill.
  const ops = useMemo(() => {
    if (showHighlights) return chapter.ops;
    return (chapter.ops || []).map(op => {
      if (op.attributes?.background) {
        const { background, ...rest } = op.attributes;
        const cleaned = { ...op };
        if (Object.keys(rest).length) cleaned.attributes = rest;
        else delete cleaned.attributes;
        return cleaned;
      }
      return op;
    });
  }, [chapter.ops, showHighlights]);

  return (
    <section ref={ref} className="chapter" data-chapter-id={chapter.id}>
      <h2 className="chapter-title">{chapter.title || `Chapter ${index + 1}`}</h2>
      <div className="chapter-meta">pages {chapter.page_start}–{chapter.page_end}</div>
      <hr className="chapter-rule" />
      {mounted ? (
        <QuillViewer ops={ops} />
      ) : (
        <div style={{ minHeight: placeholderH, color: "var(--muted)", fontStyle: "italic" }}>
          loading…
        </div>
      )}
    </section>
  );
}
