# ─────────────────────────────────────────────────────────────────────────────
# Local CI — runs on the self-hosted runner (mac-vsr-write).
# Scope (local pipeline only):
#   1. Docker-based backend tests (deps pre-baked, fast after first build)
#   2. Flutter web build (uses host-installed flutter)
# Final deploy is manual: `gh workflow run deploy.yml`
# ─────────────────────────────────────────────────────────────────────────────

name: Local CI

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths-ignore: ["*.md", "docs/**"]

jobs:
  docker-tests:
    name: "Docker Tests (backend)"
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@v4
      - name: Build CI image (pip layer cached)
        run: docker build -t write-ci:latest -f backend/Dockerfile.ci backend
      - name: Run pytest inside container
        run: |
          docker run --rm \
            -v "$PWD/backend:/app" -w /app \
            write-ci:latest \
            python -m pytest tests/ -x -q --tb=short

  flutter-web:
    name: "Flutter Web Build"
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@v4
      - name: flutter pub get
        run: flutter pub get
      - name: Build web
        run: |
          flutter build web --release
          TS=$(date +%s)
          echo "{\"version\": \"$TS\"}" > build/web/version.json
          cp privacy_policy.html terms_of_service.html data_deletion.html landing.html build/web/ 2>/dev/null || true
