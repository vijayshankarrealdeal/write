name: Play Store

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play Store track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: Release status
        required: true
        default: completed
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted
      rollout:
        description: User fraction for inProgress (e.g. 0.1 for 10%)
        required: false
        default: '1.0'

concurrency:
  group: playstore-${{ inputs.track }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check required secrets
        id: check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=()
          [[ -z "$ANDROID_KEYSTORE_BASE64" ]]        && missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -z "$ANDROID_KEYSTORE_PASSWORD" ]]      && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -z "$ANDROID_KEY_PASSWORD" ]]           && missing+=("ANDROID_KEY_PASSWORD")
          [[ -z "$ANDROID_KEY_ALIAS" ]]              && missing+=("ANDROID_KEY_ALIAS")
          [[ -z "$PLAY_STORE_SERVICE_ACCOUNT_JSON" ]] && missing+=("PLAY_STORE_SERVICE_ACCOUNT_JSON")
          if (( ${#missing[@]} > 0 )); then
            echo "::warning::Skipping Play Store deploy — missing GitHub secrets: ${missing[*]}. Set with: gh secret set <NAME>"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Match the Flutter pin used by deploy.yml so the cached toolchain is shared.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.8
          channel: stable
          cache: true

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          # Sanity check: keytool should be able to list the alias.
          keytool -list -keystore android/upload-keystore.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" >/dev/null

      - name: Write android/key.properties
        env:
          KS_PWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KS_PWD
          keyPassword=$KEY_PWD
          keyAlias=$KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      - name: Flutter pub get
        run: flutter pub get

      # versionCode = run_number + offset. Offset 100 sits above the existing
      # pubspec value (+8) so the first workflow run lands at 101 and every
      # subsequent run is monotonically higher — Play Store rejects duplicates.
      # versionName still comes from pubspec.yaml (e.g. 1.0.2).
      - name: Build signed AAB
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BUILD_NUMBER=$((RUN_NUMBER + 100))
          echo "Building versionCode=$BUILD_NUMBER"
          flutter build appbundle --release --build-number="$BUILD_NUMBER"

      - name: Write Play Store service account JSON
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > play-service-account.json

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: play-service-account.json
          packageName: com.inkspacex.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          userFraction: ${{ inputs.status == 'inProgress' && inputs.rollout || '' }}
          mappingFile: build/app/outputs/mapping/release/mapping.txt

      - name: Cleanup secrets
        if: always()
        run: rm -f play-service-account.json android/upload-keystore.jks android/key.properties
