name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check required secrets
        id: check
        env:
          DOTENV: ${{ secrets.DOTENV }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=()
          [[ -z "$DOTENV" ]] && missing+=("DOTENV")
          [[ -z "$SSH_HOST" ]] && missing+=("SSH_HOST")
          [[ -z "$SSH_PRIVATE_KEY" ]] && missing+=("SSH_PRIVATE_KEY")
          if (( ${#missing[@]} > 0 )); then
            echo "::warning::Skipping deploy — missing GitHub secrets: ${missing[*]}. Set with: gh secret set <NAME>"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q '__REPLACE_ME' <<<"$DOTENV"; then
            echo "::warning::Skipping deploy — DOTENV still contains __REPLACE_ME placeholders. Update with: gh secret set DOTENV < .env"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  build-frontend:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Pin the Flutter version. Pubspec needs Dart ^3.10.8; Flutter 3.41.8
      # ships Dart 3.10.x. With a fixed version, subosito/flutter-action's
      # cache key is deterministic and we avoid the "stable channel moved,
      # cache no longer reconciles" failure that broke run #25012595795.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.8
          channel: stable
          cache: true

      - name: Build Flutter web
        run: |
          flutter build web --release
          TS=$(date +%s)
          echo "{\"version\": \"$TS\"}" > build/web/version.json
          cp privacy_policy.html terms_of_service.html data_deletion.html landing.html build/web/

      - uses: actions/upload-artifact@v5
        with:
          name: flutter-web
          path: build/web
          retention-days: 1
          if-no-files-found: error

  build-backend:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Build admin SPA
        run: |
          cd admin
          npm install --silent
          npm run build

      - uses: actions/upload-artifact@v5
        with:
          name: admin-dist
          path: backend/admin-dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: flutter-web
          path: build/web

      - uses: actions/download-artifact@v5
        with:
          name: admin-dist
          path: backend/admin-dist

      - name: Write .env from DOTENV secret
        env:
          DOTENV: ${{ secrets.DOTENV }}
          ENV: ${{ secrets.ENV }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RAZORPAY_PLATFORM_FEE_BPS: ${{ secrets.RAZORPAY_PLATFORM_FEE_BPS }}
          RAZORPAY_RETURN_URL: ${{ secrets.RAZORPAY_RETURN_URL }}
        run: |
          printf '%s\n' "$DOTENV" > .env
          # Overlay individual secrets so they can be rotated without touching DOTENV.
          # Each: drop any existing line, then append the current value.
          # ENV defaults to "prod" when deploying via Actions — local .env keeps "dev".
          ENV_VALUE="${ENV:-prod}"
          grep -v '^ENV=' .env > .env.tmp || true
          mv .env.tmp .env
          printf 'ENV=%s\n' "$ENV_VALUE" >> .env
          if [[ -n "$AZURE_OPENAI_API_KEY" ]]; then
            grep -v '^AZURE_OPENAI_API_KEY=' .env > .env.tmp || true
            mv .env.tmp .env
            printf 'AZURE_OPENAI_API_KEY=%s\n' "$AZURE_OPENAI_API_KEY" >> .env
          fi
          if [[ -n "$AZURE_OPENAI_ENDPOINT" ]]; then
            grep -v '^AZURE_OPENAI_ENDPOINT=' .env > .env.tmp || true
            mv .env.tmp .env
            printf 'AZURE_OPENAI_ENDPOINT=%s\n' "$AZURE_OPENAI_ENDPOINT" >> .env
          fi
          # Always strip any DOTENV-baked chat deployment so the docker-compose
          # default (or the optional secret below) wins. Lets us rotate the
          # deployment name without re-publishing DOTENV.
          grep -v '^AZURE_OPENAI_CHAT_DEPLOYMENT=' .env > .env.tmp || true
          mv .env.tmp .env
          if [[ -n "$AZURE_OPENAI_CHAT_DEPLOYMENT" ]]; then
            printf 'AZURE_OPENAI_CHAT_DEPLOYMENT=%s\n' "$AZURE_OPENAI_CHAT_DEPLOYMENT" >> .env
          fi
          # Razorpay overlays — same rotation pattern. Each secret strips its
          # DOTENV-baked line (if any) and appends the current value so we can
          # swap test→live keys (or rotate after a leak) by re-running this
          # workflow without touching DOTENV.
          for var in RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET RAZORPAY_PLATFORM_FEE_BPS RAZORPAY_RETURN_URL; do
            value="${!var}"
            if [[ -n "$value" ]]; then
              grep -v "^${var}=" .env > .env.tmp || true
              mv .env.tmp .env
              printf '%s=%s\n' "$var" "$value" >> .env
            fi
          done

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # echo (not printf '%s') ensures trailing newline — OpenSSH's
          # libcrypto parser rejects keys missing the terminator.
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null   # fail fast if key is malformed

      - name: Deploy to VM
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: /home/runner/.ssh/id_deploy
          SKIP_BUILD: '1'
        run: bash ./deploy.sh
