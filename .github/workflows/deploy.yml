name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check required secrets
        id: check
        env:
          DOTENV: ${{ secrets.DOTENV }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=()
          [[ -z "$DOTENV" ]] && missing+=("DOTENV")
          [[ -z "$SSH_HOST" ]] && missing+=("SSH_HOST")
          [[ -z "$SSH_PRIVATE_KEY" ]] && missing+=("SSH_PRIVATE_KEY")
          if (( ${#missing[@]} > 0 )); then
            echo "::warning::Skipping deploy — missing GitHub secrets: ${missing[*]}. Set with: gh secret set <NAME>"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q '__REPLACE_ME' <<<"$DOTENV"; then
            echo "::warning::Skipping deploy — DOTENV still contains __REPLACE_ME placeholders. Update with: gh secret set DOTENV < .env"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Write .env from DOTENV secret
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: printf '%s' "$DOTENV" > .env

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # echo (not printf '%s') ensures trailing newline — OpenSSH's
          # libcrypto parser rejects keys missing the terminator.
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null   # fail fast if key is malformed

      - name: Deploy to VM
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: /home/runner/.ssh/id_deploy
        run: bash ./deploy.sh
