<!DOCTYPE html>
<html lang="en">

<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="Free writing software for novelists. Distraction-free editor, scene binder, AI writing assistant, and offline sync. A modern Scrivener alternative on every device.">
  <meta name="keywords" content="writing software, novel writing software, scrivener alternative, online writing tool, distraction-free writing app, ai writing assistant for fiction, best writing app, story writing software, free writing software">
  <meta name="author" content="InkSpaceX">
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1">
  <meta name="theme-color" content="#000000">
  <!-- The SPA shell at / is duplicate-content for every authenticated route.
       Canonical points at the marketing landing page so Google credits ranking
       signals to the indexable surface, not the empty shell. -->

  <!-- Replace the content value with the token from Google Search Console once the property is verified. -->

  <!-- Open Graph -->

  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="InkSpaceX — calm writing software for novelists.">

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image">

  <meta name="twitter:description" content="Distraction-free editor, smart drafting tools, offline support. A modern Scrivener alternative — free across every device.">
  <meta name="twitter:image" content="https://inkspacex.com/og-image.png">

  <!-- PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="InkSpaceX">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Referrer policy (the only security directive that actually works as a meta tag;
       X-Frame-Options / X-Content-Type-Options must be set as HTTP headers by Caddy). -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>InkSpaceX — Free Writing Software for Novels & Stories</title>

  <!-- Schema.org structured data — helps Google understand the brand and site. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "InkSpaceX",
    "alternateName": ["Ink Space X", "InkSpace X"],
    "url": "https://inkspacex.com/",
    "logo": "https://inkspacex.com/icons/Icon-512.png",

  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "InkSpaceX",
    "url": "https://inkspacex.com/",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://inkspacex.com/search?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- Loading indicator while Flutter boots. Visible feedback matters: a
       black screen with just a wordmark feels like the page is broken. We
       show a wordmark + a thin progress bar so the user can see something
       is actually happening while the Flutter bundle downloads. -->
  <style>
    body { margin: 0; background: #000; overflow: hidden; -webkit-font-smoothing: antialiased; }
    .loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .loading-wordmark {
      color: rgba(255,255,255,0.85);
      font-size: 18px; font-weight: 500; letter-spacing: 4px;
    }
    .loading-bar {
      width: 180px; height: 2px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px; overflow: hidden;
      position: relative;
    }
    .loading-bar::after {
      content: ""; position: absolute; inset: 0;
      width: 40%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
      animation: loading-slide 1.4s ease-in-out infinite;
    }
    .loading-hint {
      color: rgba(255,255,255,0.35);
      font-size: 12px; letter-spacing: 1px;
      opacity: 0; transition: opacity .4s ease;
    }
    .loading-hint.visible { opacity: 1; }
    @keyframes loading-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .loading-bar::after { animation: none; width: 100%; opacity: .4; }
    }
  </style>
</head>

<body>
  <div class="loading" id="loading">
    <div class="loading-wordmark">INKSPACEX</div>
    <div class="loading-bar"></div>
    <div class="loading-hint" id="loading-hint">Loading editor…</div>
  </div>
  <script>
    // After 2.5s, surface a hint so the user knows something is still happening.
    // (Don't show immediately — most loads finish before this.)
    var hintTimer = setTimeout(function () {
      var h = document.getElementById('loading-hint');
      if (h) h.classList.add('visible');
    }, 2500);

    window.addEventListener('flutter-first-frame', function () {
      clearTimeout(hintTimer);
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>

  <!-- Auto-update: detect new deploy and reload -->
  <script>
    (function() {
      var currentVersion = null;

      async function checkForUpdate() {
        try {
          var resp = await fetch('/version.json?t=' + Date.now(), { cache: 'no-store' });
          if (!resp.ok) return;
          var data = await resp.json();
          if (currentVersion === null) {
            currentVersion = data.version;
            return;
          }
          if (data.version !== currentVersion) {
            window.location.reload();
          }
        } catch (e) { /* ignore */ }
      }

      checkForUpdate();
      setInterval(checkForUpdate, 30000);

      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') checkForUpdate();
      });
    })();
  </script>
</body>

</html>
