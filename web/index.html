  <!-- Theme bootstrapper: must run before paint so dark-mode users don't
       see a flash of cream. Mirrors the logic in landing.html so a user
       who picked "dark" on the landing page sees a dark splash here too.
       Storage key: `inkspacex.theme`. Falls back to OS preference. -->
  <script>
    (function () {
      try {
        var stored = null;
        try { stored = localStorage.getItem('inkspacex.theme'); } catch (e) {}
        var theme = (stored === 'dark' || stored === 'light')
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* defensive — never block paint */ }
    })();
  </script>

  <!-- Loading screen while Flutter boots. The Flutter bundle is multi-MB
       and can take a few seconds on first load; a black screen with just
       the wordmark felt broken. Now: paper background (light or dark to
       match the landing page's theme — picked from localStorage or the
       OS preference), hand-drawn scribbles that animate in one after
       another like ink being applied, and a rotating writer's pep talk
       caption. Pure CSS, no network requests, ~7 KB inline. -->
  <style>
    /* Theme tokens. Colors mirror landing.html so the splash inherits
       the same look the user already chose. */
    :root {
      --splash-paper: #FAFAF7;
      --splash-ink: #111111;
      --splash-ink-soft: rgba(17,17,17,0.5);
      --splash-accent: #1E6EF4;
    }
    [data-theme="dark"] {
      --splash-paper: #191919;
      --splash-ink: #E5E8EE;
      --splash-ink-soft: rgba(229,232,238,0.55);
      --splash-accent: #5CB8FF;
    }

    body { margin: 0; background: var(--splash-paper); overflow: hidden; -webkit-font-smoothing: antialiased; }
    .loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: var(--splash-ink);
      background: var(--splash-paper);
    }
    .loading-stage {
      position: relative;
      width: 220px; height: 220px;
    }
    .loading-stage svg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      opacity: 0;
      /* mask reveals the scribble left-to-right, like ink being drawn */
      -webkit-mask-image: linear-gradient(90deg, #000 0, #000 50%, transparent 60%, transparent 100%);
              mask-image: linear-gradient(90deg, #000 0, #000 50%, transparent 60%, transparent 100%);
      -webkit-mask-size: 220% 100%;
              mask-size: 220% 100%;
      -webkit-mask-position: 100% 0;
              mask-position: 100% 0;
      animation: scribble-cycle 5.4s ease-in-out infinite;
    }
    /* Three scribbles cycle: each takes 1/3 of the loop. Stagger by 1.8s. */
    .loading-stage svg:nth-child(1) { animation-delay: 0s; }
    .loading-stage svg:nth-child(2) { animation-delay: 1.8s; }
    .loading-stage svg:nth-child(3) { animation-delay: 3.6s; }
    .loading-stage svg path { fill: var(--splash-ink); }

    @keyframes scribble-cycle {
      0%   { opacity: 0; -webkit-mask-position: 100% 0; mask-position: 100% 0; transform: translateY(6px) rotate(-3deg); }
      8%   { opacity: 1; }
      28%  { -webkit-mask-position: 0% 0; mask-position: 0% 0; transform: translateY(0) rotate(0deg); opacity: 1; }
      33%  { opacity: 1; }
      40%  { opacity: 0; }
      100% { opacity: 0; }
    }

    .loading-wordmark {
      font-size: 13px; font-weight: 600;
      letter-spacing: 6px;
      color: var(--splash-ink);
    }
    .loading-wordmark span { color: var(--splash-accent); }
    .loading-caption {
      height: 18px;
      font-size: 13px; color: var(--splash-ink-soft);
      font-style: italic;
      position: relative; min-width: 220px; text-align: center;
    }
    .loading-caption span {
      position: absolute; left: 0; right: 0;
      opacity: 0;
      animation: caption-cycle 12s ease-in-out infinite;
    }
    .loading-caption span:nth-child(1) { animation-delay: 0s; }
    .loading-caption span:nth-child(2) { animation-delay: 2.4s; }
    .loading-caption span:nth-child(3) { animation-delay: 4.8s; }
    .loading-caption span:nth-child(4) { animation-delay: 7.2s; }
    .loading-caption span:nth-child(5) { animation-delay: 9.6s; }
    @keyframes caption-cycle {
      0%   { opacity: 0; transform: translateY(4px); }
      4%   { opacity: 1; transform: translateY(0); }
      18%  { opacity: 1; transform: translateY(0); }
      22%  { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 0; }
    }

    /* Honor the user's motion preference — no animation, just hold on
       the first scribble + a static caption. */
    @media (prefers-reduced-motion: reduce) {
      .loading-stage svg:nth-child(1) { opacity: 1; -webkit-mask: none; mask: none; animation: none; }
      .loading-stage svg:nth-child(2),
      .loading-stage svg:nth-child(3) { display: none; }
      .loading-caption span { animation: none; }
      .loading-caption span:nth-child(1) { opacity: 1; }
    }
  </style>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      // Brief fade so the splash doesn't pop off — feels like a curtain lifting.
      el.style.transition = 'opacity .35s ease';
      el.style.opacity = '0';
      setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 380);
    });
  </script>

  <!-- Auto-update: detect new deploy and reload -->
  <script>
    (function() {
      var currentVersion = null;

      async function checkForUpdate() {
        try {
          var resp = await fetch('/version.json?t=' + Date.now(), { cache: 'no-store' });
          if (!resp.ok) return;
          var data = await resp.json();
          if (currentVersion === null) {
            currentVersion = data.version;
            return;
          }
          if (data.version !== currentVersion) {
            window.location.reload();
          }
        } catch (e) { /* ignore */ }
      }

      checkForUpdate();
      setInterval(checkForUpdate, 30000);

      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') checkForUpdate();
      });
    })();
  </script>
